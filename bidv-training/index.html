<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Buổi 1 — Chốt số nền và giả định</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Display:ital,wght@0,400;0,600;1,400&family=Outfit:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap&subset=latin,latin-ext,vietnamese" rel="stylesheet">
<style>
:root{
  --cream:#F7F5EF; --warm:#EFEBE0; --white:#FFFFFF;
  --green:#00704A; --forest:#1E3932; --deep:#14261F; --soft:#D4E9E2;
  --ink:#1E3932; --muted:#5C6B66; --dim:#637069;
  --line:#DFDBD0; --lined:#2C4A40;
  --line2:#CFC8B8; --txt:#1E3932; --teal:#2E8B74; --rose:#A6603A;
  --gold:#C9A227; --warn:#A6603A;
  --serif:'Noto Serif Display',Georgia,serif;
  --sans:'Outfit',system-ui,sans-serif;
  --mono:'DM Mono',ui-monospace,monospace;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--cream);color:var(--ink);font-family:var(--sans);
     font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased;overflow:hidden}
h1{font-family:var(--serif);font-weight:600;font-size:clamp(30px,4.6vw,52px);line-height:1.1;
   letter-spacing:-.015em;margin:0 0 .3em}
h2{font-family:var(--serif);font-weight:600;font-size:clamp(23px,3.1vw,35px);line-height:1.16;margin:0 0 .35em}
h3{font-size:17px;font-weight:600;margin:0 0 .4em}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--dim)}
.mono{font-family:var(--mono)}
p{margin:0 0 12px;max-width:76ch}

/* ---------- khung slide ---------- */
#deck{height:100vh;width:100vw;position:relative}
.slide{position:absolute;inset:0;padding:56px 60px 74px;display:none;
       flex-direction:column;overflow-y:auto}
.slide.on{display:flex}
.slide.center{justify-content:center}
.stitle{margin-bottom:18px;flex:none}
.sbody{flex:1;min-height:0}

/* ---------- thanh điều hướng ---------- */
#bar{position:fixed;left:0;right:0;bottom:0;height:52px;background:var(--forest);color:#fff;
     display:flex;align-items:center;gap:16px;padding:0 22px;z-index:60}
#bar .nav{display:flex;gap:6px}
#bar button{border:1px solid var(--lined);background:transparent;color:#cfe0d8;border-radius:999px;
     width:32px;height:30px;cursor:pointer;font-size:14px;font-family:var(--sans)}
#bar button:hover{background:rgba(255,255,255,.1)}
#bar .lbl{font-family:var(--mono);font-size:11px;color:#9db3aa;flex:1;
     white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#bar .cnt{font-family:var(--mono);font-size:11px;color:#cfe0d8}
#prog{position:fixed;left:0;bottom:52px;height:3px;background:var(--gold);z-index:61;transition:width .28s}
#dots{display:flex;gap:4px}
#dots i{width:7px;height:7px;border-radius:50%;background:var(--lined);cursor:pointer;display:block}
#dots i.on{background:var(--gold)}
#dots i.act{background:#fff}

/* ---------- thành phần chung ---------- */
.card{border:1px solid var(--line);border-radius:14px;background:var(--white);padding:18px 20px}
.card.warm{background:var(--warm)}
.note{border-left:3px solid var(--green);background:var(--white);padding:13px 17px;
      border-radius:0 10px 10px 0;font-size:14.5px;color:var(--muted);line-height:1.6}
.note.warn{border-left-color:var(--warn);background:#FDF6F1}
.note.gold{border-left-color:var(--gold);background:#FDFAF0}
.note b{color:var(--ink)}
.quote{font-family:var(--serif);font-style:italic;font-size:clamp(17px,2vw,23px);
       border-left:3px solid var(--green);background:var(--soft);padding:18px 24px;
       border-radius:0 12px 12px 0;line-height:1.4;color:var(--ink)}
.btn{border:1.5px solid var(--green);color:var(--green);background:transparent;border-radius:999px;
     padding:9px 22px;font:500 14px var(--sans);cursor:pointer}
.btn:hover{background:rgba(0,112,74,.07)}
.btn.pri{background:var(--green);color:#fff}
.btn.pri:hover{background:#005c3c}
.btn.sm{padding:6px 15px;font-size:13px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
table{width:100%;border-collapse:collapse;font-size:14px;background:var(--white)}
th{background:var(--forest);color:#fff;font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;
   text-transform:uppercase;text-align:left;padding:8px 12px;font-weight:400;white-space:nowrap}
td{padding:8px 12px;border-bottom:1px solid var(--line)}
td.n{text-align:right;font-family:var(--mono);font-size:13.5px;white-space:nowrap}
tr.tot td{background:var(--soft);font-weight:600;border-top:2px solid var(--forest)}
.tag{font-family:var(--mono);font-size:10px;border:1px solid var(--line);border-radius:999px;
     padding:2px 9px;color:var(--dim);white-space:nowrap}
.tag.g{border-color:var(--green);color:var(--green)}
.tag.w{border-color:var(--warn);color:var(--warn);background:#FDF6F1}
input[type=range]{width:100%;accent-color:var(--green);height:26px}
input:focus-visible,button:focus-visible{outline:none;box-shadow:0 0 0 3px rgba(0,112,74,.2)}
.sld .row{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.sld label{font-size:13.5px;font-weight:500}
.sld .v{font-family:var(--mono);font-size:14px;color:var(--green);font-weight:500}
.sld .b{font-family:var(--mono);font-size:10.5px;color:var(--dim)}
.kpi{border:1px solid var(--line);border-radius:12px;background:var(--white);padding:12px 15px}
.kpi .k{font-size:12px;color:var(--muted)}
.kpi .v{font-family:var(--mono);font-size:24px;font-weight:500;line-height:1.25}
.kpi .d{font-family:var(--mono);font-size:11px;color:var(--dim)}
.kpi.hi{background:var(--soft);border-color:var(--green)}
.kpi.bad .v{color:var(--warn)}
.kpi.good .v{color:var(--green)}

/* ---------- nhãn khám phá ---------- */
.explore{display:inline-flex;align-items:center;gap:7px;font-family:var(--mono);font-size:10px;
  letter-spacing:.14em;text-transform:uppercase;color:var(--gold);border:1px solid var(--gold);
  border-radius:999px;padding:3px 12px;background:#FDFAF0}
.explore::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--gold)}

/* ---------- màn 3: trục thời gian ---------- */
.tl{position:relative;margin:22px 0 10px;padding:0 4px}
.tl-track{height:4px;background:var(--warm);border-radius:2px;position:relative}
.tl-fill{position:absolute;top:0;bottom:0;left:0;background:var(--green);border-radius:2px}
.tl-steps{display:flex;justify-content:space-between;margin-top:-9px}
.tl-step{width:14px;height:14px;border-radius:50%;background:var(--white);border:2px solid var(--green);
  cursor:pointer;position:relative;flex:none}
.tl-step.dim{border-color:var(--line)}
.tl-step.act{background:var(--green);transform:scale(1.35)}
.tl-lbl{display:flex;justify-content:space-between;margin-top:10px;font-family:var(--mono);
  font-size:10px;color:var(--dim)}
.tl-lbl span{width:52px;text-align:center}
#roomZone{position:absolute;top:-6px;bottom:-6px;background:rgba(166,96,58,.14);
  border-left:2px dashed var(--warn);border-radius:3px;pointer-events:none}
#stepDetail{margin-top:16px;min-height:96px}

/* ---------- màn 5: dự đoán ---------- */
.pred{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;max-width:760px}
.pred button{border:1.5px solid var(--line);background:var(--white);border-radius:14px;padding:20px 16px;
  cursor:pointer;text-align:left;font-family:var(--sans);transition:border-color .15s}
.pred button:hover{border-color:var(--green)}
.pred button.sel{border-color:var(--green);background:var(--soft)}
.pred .pv{font-family:var(--serif);font-size:26px;font-weight:600;color:var(--ink)}
.pred .pd{font-size:13px;color:var(--muted);margin-top:5px;line-height:1.45}
#predOut{margin-top:20px}

/* ---------- màn 6: biểu đồ cầu ---------- */
.wf{display:flex;align-items:flex-end;gap:14px;height:270px;padding-top:8px}
.wf .col{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%}
.wf .bar{width:100%;border-radius:7px 7px 0 0;position:relative;transition:height .5s ease}
.wf .cap{font-family:var(--mono);font-size:12.5px;margin-bottom:5px;font-weight:500}
.wf .nm{font-size:12px;color:var(--muted);text-align:center;margin-top:8px;line-height:1.35}

/* ---------- màn 10: cơ cấu nguồn ---------- */
.fund .frow{display:flex;align-items:center;gap:12px;margin-bottom:9px;font-size:13.5px}
.fund .fn{width:220px;flex:none}
.fund .fw{flex:1;height:20px;background:var(--warm);border-radius:5px;overflow:hidden}
.fund .fb{display:block;height:100%;border-radius:5px;transition:width .4s}
.fund .fv{width:96px;text-align:right;font-family:var(--mono);font-size:13px;flex:none}
.fund .fg{width:78px;text-align:right;font-family:var(--mono);font-size:12px;flex:none}
.chain{display:flex;align-items:stretch;gap:0;margin-top:14px}
.chain .ci{flex:1;background:var(--white);border:1px solid var(--line);padding:13px 15px;position:relative}
.chain .ci:first-child{border-radius:12px 0 0 12px}
.chain .ci:last-child{border-radius:0 12px 12px 0}
.chain .ci+.ci{border-left:none}
.chain .cl{font-family:var(--mono);font-size:9.5px;color:var(--dim);text-transform:uppercase;letter-spacing:.08em}
.chain .cv{font-family:var(--mono);font-size:19px;font-weight:500;margin-top:3px}
.chain .cs{font-size:11.5px;color:var(--muted);margin-top:3px;line-height:1.4}
.chain .ci.alert{background:#FDF6F1;border-color:var(--warn)}
.chain .ci.alert .cv{color:var(--warn)}

/* ---------- màn 12: biểu đồ độ nhạy ---------- */
.tor{margin-top:6px}
.tor .trow{display:flex;align-items:center;gap:11px;margin-bottom:8px}
.tor .tn{width:250px;flex:none;font-size:13.5px}
.tor .tmid{flex:1;position:relative;height:26px}
.tor .taxis{position:absolute;left:50%;top:-3px;bottom:-3px;width:1px;background:var(--line)}
.tor .tb{position:absolute;top:3px;bottom:3px;border-radius:4px;transition:all .35s}
.tor .tb.pos{background:var(--green);left:50%}
.tor .tb.neg{background:var(--warn);right:50%}
.tor .tv{width:104px;text-align:right;font-family:var(--mono);font-size:13px;flex:none}
.tor .tr{width:118px;flex:none;font-family:var(--mono);font-size:11px;color:var(--dim);text-align:right}

/* ---------- ghi chú giảng viên ---------- */
#notes{position:fixed;right:0;top:0;bottom:52px;width:400px;background:var(--deep);color:#cfe0d8;
  padding:26px 26px 26px;overflow-y:auto;transform:translateX(100%);transition:transform .25s;z-index:55;
  font-size:13.5px;line-height:1.65}
#notes.on{transform:translateX(0)}
#notes h4{font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--gold);margin:0 0 12px}
#notes b{color:#fff}
#notes .blk{margin-bottom:18px;padding-bottom:16px;border-bottom:1px solid var(--lined)}
#notes .blk:last-child{border:none}
#notes .q{font-family:var(--serif);font-style:italic;font-size:15px;color:#fff;
  border-left:2px solid var(--gold);padding-left:12px;margin:8px 0}

.hint{font-family:var(--mono);font-size:10.5px;color:var(--dim);margin-top:9px}
.src{font-family:var(--mono);font-size:10px;color:var(--dim);margin-top:auto;padding-top:14px}
@media(max-width:900px){.slide{padding:34px 24px 70px}.g2,.g3,.g4,.pred{grid-template-columns:1fr}
  .fund .fn{width:130px}.tor .tn{width:150px}#notes{width:100%}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}

/* ===== A1 · xếp thẻ ===== */
.cardpool{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.ct{border:1.5px solid var(--line);background:var(--white);border-radius:10px;padding:8px 13px;
  cursor:pointer;font-size:13px;line-height:1.35;max-width:290px;transition:border-color .14s,opacity .2s}
.ct:hover{border-color:var(--green)}
.ct.used{opacity:.28;pointer-events:none}
.ct .cm{font-family:var(--mono);font-size:9.5px;color:var(--dim);display:block;margin-top:3px}
.seq{display:flex;flex-direction:column;gap:5px;min-height:60px}
.slot{display:flex;align-items:center;gap:10px;border:1px dashed var(--line);border-radius:9px;
  padding:7px 12px;background:var(--warm);font-size:13px;min-height:38px}
.slot .no{font-family:var(--mono);font-size:11px;color:var(--dim);width:20px;flex:none}
.slot .tx{flex:1;cursor:pointer}
.slot.ok{border-style:solid;border-color:var(--green);background:var(--soft)}
.slot.err{border-style:solid;border-color:var(--warn);background:#FDF6F1}
.slot .mk{font-family:var(--mono);font-size:11px;flex:none}
.slot.ok .mk{color:var(--green)}.slot.err .mk{color:var(--warn)}
.a1grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;align-items:start}

/* ===== A2 · Gantt ===== */
.gantt{margin-top:6px}
.grow{display:flex;align-items:center;gap:10px;margin-bottom:5px;font-size:12.5px}
.grow .gn{width:290px;flex:none;line-height:1.3}
.grow .gt{flex:1;position:relative;height:22px;background:var(--warm);border-radius:5px}
.gbar{position:absolute;top:3px;bottom:3px;border-radius:4px;background:var(--green);
  display:flex;align-items:center;padding-left:7px;font-family:var(--mono);font-size:9.5px;color:#fff}
.gbar.late{background:var(--forest)}
.gscale{display:flex;margin:8px 0 0 300px;font-family:var(--mono);font-size:10px;color:var(--dim)}
.gscale span{flex:1;text-align:center}
.gantt{position:relative;padding-top:20px}
.gvline{position:absolute;top:20px;bottom:34px;width:2px;background:var(--warn);z-index:4;pointer-events:none}
.gvline::after{content:attr(data-l);position:absolute;top:-17px;left:50%;transform:translateX(-50%);
  white-space:nowrap;font-family:var(--mono);font-size:9.5px;color:var(--warn);
  background:var(--cream);padding:0 6px}
.modesw{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;margin-bottom:12px}
.modesw button{border:none;background:transparent;padding:7px 17px;font:500 13px var(--sans);
  cursor:pointer;color:var(--muted)}
.modesw button.on{background:var(--green);color:#fff}

/* ===== A4 · bỏ phiếu điểm nghẽn ===== */
.vsteps{display:flex;flex-direction:column;gap:5px}
.vrow{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:9px;
  padding:7px 12px;background:var(--white);cursor:pointer;font-size:13px;transition:border-color .15s}
.vrow:hover{border-color:var(--green)}
.vrow .vn{font-family:var(--mono);font-size:10.5px;color:var(--dim);width:52px;flex:none}
.vrow .vt{flex:1;line-height:1.3}
.vrow .vbw{width:190px;flex:none;height:15px;background:var(--warm);border-radius:4px;overflow:hidden}
.vrow .vb{display:block;height:100%;background:var(--green);border-radius:4px;transition:width .3s}
.vrow .vc{width:34px;text-align:right;font-family:var(--mono);font-size:13px;flex:none}
.vrow.hot{border-color:var(--warn);background:#FDF6F1}
.vrow.hot .vb{background:var(--warn)}

/* ===== A5 · ba tầng ===== */
.tier{border:1px solid var(--line);border-radius:14px;background:var(--white);padding:16px 19px;margin-bottom:12px}
.tier.lock{background:var(--warm);border-style:dashed}
.tier .th{display:flex;align-items:center;gap:11px;flex-wrap:wrap;margin-bottom:9px}
.tier .tnum{font-family:var(--mono);font-size:10px;letter-spacing:.14em;color:var(--gold)}
.tier .tq{font-family:var(--serif);font-size:19px;font-weight:600;line-height:1.25}
.opts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:10px}
.opts.two{grid-template-columns:repeat(2,1fr)}
.opt{border:1.5px solid var(--line);background:var(--white);border-radius:11px;padding:11px 14px;
  cursor:pointer;text-align:left;font-family:var(--sans);position:relative;overflow:hidden}
.opt:hover{border-color:var(--green)}
.opt .on2{font-size:14px;font-weight:600;position:relative;z-index:2}
.opt .on2{display:block}
.opt .oc{display:block;font-family:var(--mono);font-size:11px;color:var(--dim);margin-top:4px;position:relative;z-index:2}
.opt .ofill{position:absolute;left:0;top:0;bottom:0;background:var(--soft);transition:width .35s;z-index:1}
.opt.win{border-color:var(--green)}
.opt.win .ofill{background:rgba(0,112,74,.16)}
.reveal{display:none}
.reveal.on{display:block}

/* ===== khối B ===== */
.bgrid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.bitem{border:1.5px solid var(--line);border-radius:11px;background:var(--white);padding:11px 14px}
.bitem .bn{font-size:14px;font-weight:600;display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.bitem .bnum{font-family:var(--mono);font-size:12px;color:var(--dim);white-space:nowrap}
.bitem .bsel{display:flex;gap:5px;margin-top:8px;flex-wrap:wrap}
.bitem .bsel button{border:1px solid var(--line);background:transparent;border-radius:999px;
  padding:3px 11px;font:400 11.5px var(--sans);cursor:pointer;color:var(--muted)}
.bitem .bsel button:hover{border-color:var(--green)}
.bitem .bsel button.pick{background:var(--green);border-color:var(--green);color:#fff}
.bitem .bsel button.wrong{background:#FDF6F1;border-color:var(--warn);color:var(--warn)}
.bitem .bmech{font-size:12.5px;color:var(--muted);line-height:1.5;margin-top:8px;
  border-left:2px solid var(--line);padding-left:10px;display:none}
.bitem .bmech.on{display:block}
.bitem.g1{border-left:4px solid var(--green)}
.bitem.g2{border-left:4px solid var(--warn)}
.bitem.g3{border-left:4px solid var(--gold)}
.blegend{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:12px;font-size:12.5px;color:var(--muted)}
.blegend span{display:flex;align-items:center;gap:6px}
.blegend i{width:11px;height:11px;border-radius:3px;display:block}
.peel tr.cur td{background:var(--soft);font-weight:600}
.peel td.d{font-family:var(--mono);font-size:13.5px;text-align:right;white-space:nowrap}
.decomp td.v{font-family:var(--mono);text-align:right;white-space:nowrap}
.decomp tr.pos td.v{color:var(--green)}
.decomp tr.neg td.v{color:var(--warn)}
.flow{display:flex;flex-direction:column;gap:4px;font-size:13.5px}
.flow .fr{display:flex;align-items:center;gap:12px;padding:8px 14px;border-radius:9px;background:var(--white);
  border:1px solid var(--line)}
.flow .fr.op{background:var(--warm);border-style:dashed}
.flow .fr.tot{background:var(--soft);border-color:var(--green);font-weight:600}
.flow .fl{flex:1}
.flow .fv{font-family:var(--mono);font-size:14px;white-space:nowrap}
.flow .fs{font-family:var(--mono);font-size:15px;width:16px;text-align:center;color:var(--dim);flex:none}

/* ===== giải phẫu mô hình ===== */
.anat{display:grid;grid-template-columns:1fr 1fr;gap:18px;align-items:start}
.stack{display:flex;flex-direction:column;gap:6px}
.lay{border:1px solid var(--line);border-radius:11px;background:var(--white);padding:11px 15px;
  opacity:.22;transition:opacity .3s,border-color .2s}
.lay.on{opacity:1}
.lay.act{border-color:var(--green);background:var(--soft)}
.lay .lh{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.lay .ln{font-size:14px;font-weight:600}
.lay .lv{font-family:var(--mono);font-size:15px;white-space:nowrap}
.lay .lb{font-family:var(--mono);font-size:10.5px;color:var(--dim);margin-top:3px}
.lay.neg .lv{color:var(--warn)}
.lay.sum{background:var(--forest);border-color:var(--forest)}
.lay.sum .ln,.lay.sum .lv{color:#fff}
.lay.sum .lb{color:#9db3aa}
.kind{font-family:var(--mono);font-size:9px;letter-spacing:.1em;text-transform:uppercase;
  border-radius:999px;padding:2px 8px;border:1px solid;white-space:nowrap}
.kind.k1{color:var(--green);border-color:var(--green)}
.kind.k2{color:var(--warn);border-color:var(--warn)}

let cur=0;
const deck=document.getElementById('deck');
SL.forEach((s,i)=>{
  const d=document.createElement('div');
  d.className='slide'+(s.cls==='center'?' center':'');
  d.id='sl'+i; d.innerHTML=s.html; deck.appendChild(d);
});
const dots=document.getElementById('dots');
SL.forEach((s,i)=>{const b=document.createElement('i');b.onclick=()=>show(i);dots.appendChild(b);});

function show(i){
  cur=Math.max(0,Math.min(SL.length-1,i));
  document.querySelectorAll('.slide').forEach((e,k)=>e.classList.toggle('on',k===cur));
  [...dots.children].forEach((e,k)=>{e.className=(k<cur?'on':'')+(k===cur?' act':'');});
  document.getElementById('barLbl').textContent=SL[cur].lbl;
  document.getElementById('barCnt').textContent=(cur+1)+' / '+SL.length;
  document.getElementById('prog').style.width=((cur+1)/SL.length*100)+'%';
  document.getElementById('notes').innerHTML=SL[cur].notes||'<h4>Ghi chú</h4><div class="blk">—</div>';
  drawCrumb();
  if(SL[cur].code&&INIT[SL[cur].code])INIT[SL[cur].code]();
  document.getElementById('sl'+cur).scrollTop=0;
}
function drawCrumb(){
  const s=SL[cur], cb=document.getElementById('crumb'), sec=SECT[s.sec];
  const wrap=document.getElementById('sl'+cur);
  if(!sec){cb.className='hide';document.querySelectorAll('.slide').forEach(e=>e.classList.remove('crumbed'));return;}
  cb.className='';
  document.querySelectorAll('.slide').forEach(e=>e.classList.remove('crumbed'));
  wrap.classList.add('crumbed');
  const it=sec.items.find(x=>x[0]===s.code);
  cb.innerHTML='<span class="cbit">'+SESSION+'</span>'+
    '<span class="cbit'+(it?'':' act')+'">Khối '+sec.c+' · '+sec.n+'</span>'+
    (it?'<span class="cbit act">'+it[0]+' · '+it[1]+'</span>':'')+
    '<span class="cright">'+sec.m+' phút cho khối '+sec.c+'</span>';
}
function go(d){show(cur+d)}
function toggleNotes(){document.getElementById('notes').classList.toggle('on')}
document.addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT')return;
  if(e.key==='ArrowRight'||e.key===' '||e.key==='PageDown'){e.preventDefault();go(1)}
  else if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();go(-1)}
  else if(e.key.toLowerCase()==='n')toggleNotes();
  else if(e.key==='Home')show(0);
  else if(e.key==='End')show(SL.length-1);
});

/* ══════════ A1 · xếp thẻ ══════════ */
const A1OK=[
 ['Đánh giá thực hiện 9 tháng, ước cả năm','T9–T10'],
 ['Định hướng chiến lược và khung giả định vĩ mô','T10'],
 ['Dựng khung chỉ tiêu toàn hàng từ trên xuống','T10–T11'],
 ['Ban hành hướng dẫn, biểu mẫu, chỉ tiêu định hướng tạm','T11'],
 ['Chi nhánh lập kế hoạch và bảo vệ','T11–T12'],
 ['Tổng hợp, đối chiếu chênh lệch trên xuống – dưới lên','T12'],
 ['Cân đối nguồn – sử dụng vốn, ràng buộc an toàn','T12'],
 ['Ngân sách chi phí, nhân sự, đầu tư','T12–T1'],
 ['Trình Hội đồng Quản trị phê duyệt','T1–T2'],
 ['Giao chỉ tiêu, gắn chỉ số đánh giá và cơ chế động lực','T1–T3']];
const A1NOISE=[
 ['Đại hội đồng cổ đông thường niên thông qua kế hoạch','T4 · sau khi kế hoạch đã chạy một quý'],
 ['Kiểm toán độc lập báo cáo tài chính năm','T1–T3 · chu trình báo cáo, không phải lập kế hoạch'],
 ['Xây dựng chiến lược phát triển 5 năm','chu kỳ nhiều năm, không phải hằng năm'],
 ['Quyết toán thuế thu nhập doanh nghiệp','T3 · chu trình thuế'],
 ['Rà soát hệ thống xếp hạng tín dụng nội bộ','hoạt động thường xuyên cả năm']];
let A1pool=[], A1seq=[];
function a1build(){
  A1pool=A1OK.map((c,i)=>({t:c[0],m:c[1],ok:true,i:i}))
        .concat(A1NOISE.map((c,i)=>({t:c[0],m:c[1],ok:false,i:100+i})));
  for(let i=A1pool.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[A1pool[i],A1pool[j]]=[A1pool[j],A1pool[i]];}
  A1seq=[]; a1draw();
}
function a1draw(){
  document.getElementById('pool').innerHTML=A1pool.map((c,k)=>
    `<div class="ct${A1seq.indexOf(c)>=0?' used':''}" onclick="a1add(${k})">${c.t}
     <span class="cm">${c.m}</span></div>`).join('');
  const s=document.getElementById('seq');
  s.innerHTML=A1seq.map((c,k)=>
    `<div class="slot" id="sl_${k}"><span class="no">${k+1}</span>
     <span class="tx" onclick="a1rm(${k})">${c.t}</span><span class="mk"></span></div>`).join('')
    +`<div class="slot" style="opacity:.5;justify-content:center;color:var(--dim)">
      ${A1seq.length?'bấm thẻ bên trái để thêm':'chưa có thẻ nào — bấm thẻ bên trái'}</div>`;
}
function a1add(k){const c=A1pool[k]; if(A1seq.indexOf(c)<0){A1seq.push(c);a1draw();
  document.getElementById('a1out').innerHTML='';}}
function a1rm(k){A1seq.splice(k,1);a1draw();document.getElementById('a1out').innerHTML='';}
function a1reset(){a1build();document.getElementById('a1out').innerHTML='';}
function a1check(){
  let right=0,wrongPos=0,noise=0,expect=0;
  A1seq.forEach((c,k)=>{
    const el=document.getElementById('sl_'+k), mk=el.querySelector('.mk');
    if(!c.ok){el.className='slot err';mk.textContent='không thuộc chu trình';noise++;return;}
    if(c.i===expect){el.className='slot ok';mk.textContent='đúng vị trí';right++;expect++;}
    else{el.className='slot err';mk.textContent='lệch thứ tự';wrongPos++;expect++;}
  });
  const miss=A1OK.length-A1seq.filter(c=>c.ok).length;
  document.getElementById('a1out').innerHTML=
   `<div class="note ${noise||wrongPos?'warn':'gold'}">
     <b>${right}/${A1OK.length} thẻ đúng vị trí.</b>
     ${noise?` Có <b>${noise} thẻ không thuộc chu trình lập kế hoạch</b> bị đưa lên — đó là việc có thật, cùng mùa, nhưng thuộc chu trình khác.`:''}
     ${wrongPos?` ${wrongPos} thẻ lệch thứ tự.`:''}
     ${miss>0?` Còn ${miss} việc chưa đưa lên.`:''}
     ${(!noise&&!wrongPos&&miss===0)?' Trùng khớp hoàn toàn với thông lệ ngành — sang màn sau để đối chiếu chi tiết.':''}
    </div>`;
}
INIT['A1']=function(){ if(!A1pool.length)a1build(); };

function rlState(i,mark){
  const s=STEPS[i][4], e=STEPS[i][4]+STEPS[i][5];

  if(s<mark)  return 'cut';
  return 'post';
}
function drawRL(){
  const TOT=10, rv=+document.getElementById('roomT').value;
  const mark=STEPS[rv][4];                       // mốc giao giới hạn = đầu bước được chọn

  const st=STEPS.map((s,i)=>rlState(i,mark));

    STEPS.map((s,i)=>`<div class="rlr${i===rlSel?' sel':''}" onclick="rlPick(${i})">

      <div class="rlt"><div class="rlbar ${st[i]}"
        style="left:${s[4]/TOT*100}%;width:${s[5]/TOT*100}%">${s[0]}</div></div></div>`).join('')
    +`<div class="rlmark" data-l="giới hạn được giao"
       style="left:calc(259px + (100% - 259px) * ${mark/TOT})"></div>`;
  document.getElementById('rlScale').innerHTML=GMONTH.map(m=>'<span>'+m+'</span>').join('');
  const nPre=st.filter(x=>x==='pre').length, nCut=st.filter(x=>x==='cut').length;

  document.getElementById('rlSide').innerHTML=

    ${pre.length?'<ul class="rllist">'+pre.map(x=>`<li><span>${STEPS[x.i][1]}</span>${x.n}</li>`).join('')+'</ul>':''}`;
  const late=mark>=STEPS[8][4];
  document.getElementById('rlNote').innerHTML=
   `<div class="g2">

        ${late?'Toàn bộ phần dựng khung, đàm phán và cân đối đã phải hoàn tất khi chưa biết ràng buộc lớn nhất — và giới hạn này còn có thể được nới giữa năm.':'Trường hợp thuận lợi. Thực tế ngành ngân hàng Việt Nam hiếm khi như vậy — kéo sang phải để thấy tình huống thường gặp.'}</div>

        phải dựng được nhiều phương án, nhanh, trên cùng một bộ giả định. Đó là nội dung của
        buổi 2 và buổi 3.</div>
    </div>`;

let VOTES=new Array(11).fill(0);
INIT['A5']=function(){vdraw()};
function vadd(i){VOTES[i]++;vdraw()}
function vreset(){VOTES=new Array(11).fill(0);vdraw();document.getElementById('vout').innerHTML=''}
function vdraw(){
  const mx=Math.max(1,...VOTES), tot=VOTES.reduce((a,b)=>a+b,0);
  document.getElementById('vsteps').innerHTML=STEPS.map((s,i)=>
    `<div class="vrow${VOTES[i]===mx&&VOTES[i]>0?' hot':''}" onclick="vadd(${i})">
      <span class="vn">Bước ${s[1]}</span><span class="vt">${s[2]}</span>
      <span class="vbw"><span class="vb" style="width:${VOTES[i]/mx*100}%"></span></span>
      <span class="vc">${VOTES[i]||''}</span></div>`).join('');
  document.getElementById('vtot').textContent=tot?tot+' phiếu':'chưa có phiếu';
  if(tot>=4){
    const rank=STEPS.map((s,i)=>({n:s[1],t:s[2],v:VOTES[i]})).sort((a,b)=>b.v-a.v).slice(0,2);
    document.getElementById('vout').innerHTML=
      `<div class="note"><b>Hai điểm nghẽn được chấm nhiều nhất:</b> bước ${rank[0].n} — ${rank[0].t}${rank[1].v?`, và bước ${rank[1].n} — ${rank[1].t}`:''}.
       Sang màn sau để phân tích nguyên nhân.</div>`;
  }
}

function drawT1(){
  const mx=Math.max(1,...V1), tot=V1.reduce((a,b)=>a+b,0);

    `<button class="opt${V1[i]===mx&&V1[i]>0&&tot?' win':''}" onclick="v1(${i})">

      <span class="on2">${o.n}</span><span class="oc">${V1[i]||0} phiếu</span></button>`).join('');

      T1OPT.map(o=>`<div class="note" style="margin-bottom:9px"><b>${o.n}.</b> ${o.d}</div>`).join('')+

       cộng thêm hệ số. Cuối cùng cả hai đàm phán trên số đã méo — và không bên nào còn biết
       năng lực thật là bao nhiêu.</div>`;
    document.getElementById('t2').className='tier';
    document.getElementById('b2').innerHTML=
      `<p style="font-size:14px;color:var(--muted);margin-bottom:11px">Hai cách này <b>bổ sung nhau</b>, không thay thế nhau.</p>

        <div class="opt" style="cursor:default"><span class="on2">Đàm phán</span>
          <span class="oc" style="font-family:var(--sans);font-size:12.5px;color:var(--muted);line-height:1.5">
          Vòng giao chỉ tiêu và phản hồi, lặp cho đến khi hai bên chấp nhận được</span></div>
        <div class="opt" style="cursor:default"><span class="on2">Phân tích tổng thể</span>
          <span class="oc" style="font-family:var(--sans);font-size:12.5px;color:var(--muted);line-height:1.5">
          Đưa mọi đơn vị về cùng một khung số, cùng bộ giả định, so sánh trên <b>năng suất</b> thay vì số tuyệt đối</span></div>
       </div>
       <button class="btn sm" style="margin-top:11px" onclick="tierShow(3)">Mở tầng 3</button>`;

      `<p style="font-size:14px;color:var(--muted);margin-bottom:10px">Rào cản nào lớn nhất ở đơn vị anh chị? Bấm để bỏ phiếu.</p>
       <div class="opts" id="o3"></div><div id="r3" style="margin-top:12px"></div>`;
    drawT3();

}
function v3(i){V3[i]++;drawT3()}
function drawT3(){
  const mx=Math.max(1,...V3), tot=V3.reduce((a,b)=>a+b,0);

    `<button class="opt${V3[i]===mx&&V3[i]>0&&tot?' win':''}" onclick="v3(${i})">

  if(tot>=3)document.getElementById('r3').innerHTML=
    `<div class="note warn"><b>Ba rào cản, cùng một hệ quả:</b> chỉ chạy được hai đến ba vòng lặp.
     Kế hoạch cuối cùng là cái <i>thỏa thuận được</i>, chưa chắc là cái <i>bảo vệ được</i>.</div>

let rrCur=0;
INIT['B1']=function(){rrTab(rrCur)};
function rrTab(k){
  rrCur=k;
  [0,1,2].forEach(i=>document.getElementById('rrT'+i).classList.toggle('on',i===k));
  const T=RRTAB[k];
  document.getElementById('rrCapt').textContent=T.capt;
  if(k===2){ rrRatios(); return; }
  const cls=t=>t===2?'tot':(t===4?'tot':(t===1?'sub':''));
  document.getElementById('rrTbl').innerHTML=
   '<thead><tr><th>Chỉ tiêu</th><th class="n">2024</th><th class="n">2025</th>'+
   '<th class="n">Δ tuyệt đối</th><th class="n">Δ%</th></tr></thead><tbody>'+
   T.rows.map(r=>{const a=D[r[1]].y24,b=D[r[1]].y25,g=pc(b,a),d0=b-a,neg=r[2]===3;
     const col=(neg?-g:g)>=0?'var(--green)':'var(--warn)';
     return `<tr class="${cls(r[2])}"><td class="lb">${neg?'− ':''}${r[0]}</td>
       <td class="n">${f(a)}</td><td class="n">${f(b)}</td>
       <td class="n" style="color:${col};font-weight:500">${(d0>=0?'+':'−')+f(Math.abs(d0))}</td>
       <td class="n" style="color:${col}">${(g>=0?'+':'−')+f2(Math.abs(g))}%</td></tr>`;}).join('')+
   '</tbody>';
  if(k===1) drawBSChart(); else rrChart(T.chart);
  document.getElementById('rrNote').innerHTML= k===0
   ? `<div class="note gold" style="font-size:13.5px"><b>Dòng tăng mạnh nhất là lãi thuần hoạt động khác</b> —
      từ ${f(D.hdk.y24)} lên ${f(D.hdk.y25)} tỷ, gấp ${f1(D.hdk.y25/D.hdk.y24)} lần. Trong khi đó ngoại hối
      và mua bán chứng khoán đều giảm. Lợi nhuận trước thuế tăng ${f(D.pbt.y25-D.pbt.y24)} tỷ.</div>`
   : `<div class="note" style="font-size:13.5px">Dư nợ cho vay tăng ${f2(pc(D.loan.y25,D.loan.y24))}%
      trong khi tiền gửi khách hàng tăng ${f2(pc(D.dep.y25,D.dep.y24))}%. Phần chênh được bù bằng
      tiền gửi và vay các tổ chức tín dụng, tăng ${f2(pc(D.tctd.y25,D.tctd.y24))}%.</div>`;
}
function rrChart(keys){
  const NAME={nii:'Thu nhập lãi thuần',hdk:'Lãi thuần HĐ khác',opex:'Chi phí hoạt động',
              prov:'Chi phí dự phòng',pbt:'Lợi nhuận trước thuế',loan:'Cho vay khách hàng',
              dep:'Tiền gửi khách hàng',tctd:'Tiền gửi & vay TCTD',equity:'Vốn chủ sở hữu'};
  const mx=Math.max(...keys.map(k=>Math.max(D[k].y24,D[k].y25)));
  document.getElementById('rrChart').innerHTML=
   `<div class="cclg"><span><i style="background:rgba(0,112,74,.32)"></i>2024</span>
     <span><i style="background:var(--green)"></i>2025</span></div>`+
   keys.map(k=>{const a=D[k].y24,b=D[k].y25,g=pc(b,a);
     return `<div class="ccrow"><div class="ccn">${NAME[k]}
       <span class="mono" style="font-size:11px;color:${g>=0?'var(--green)':'var(--warn)'}">
       ${(g>=0?'+':'−')+f1(Math.abs(g))}%</span></div>
       <div class="ccbars"><span class="ccb y24" style="height:${a/mx*100}%"></span>
         <span class="ccb y25" style="height:${b/mx*100}%"></span></div>
       <div class="ccv"><span>${f(a)}</span><span>${f(b)}</span></div></div>`;}).join('');
}
function rrRatios(){ drawRatio(); }

 {n:'Tỷ lệ chi phí trên thu nhập',short:'Chi phí / thu nhập',inv:true,
  num:{n:'Chi phí hoạt động',k:'opex'}, den:{n:'Tổng thu nhập hoạt động',k:'toi'},
  why:(a,b)=>`Chi phí hoạt động tăng ${f2(pc(D.opex.y25,D.opex.y24))}%, nhưng tổng thu nhập tăng nhanh hơn — ${f2(pc(D.toi.y25,D.toi.y24))}%. Mẫu số tăng nhanh hơn tử số nên tỷ lệ giảm.`},
 {n:'Tỷ lệ tiền gửi không kỳ hạn',short:'Tiền gửi không kỳ hạn',inv:false,

  why:()=>`Tiền gửi không kỳ hạn tăng ${f2(pc(D.casaAmt.y25,D.casaAmt.y24))}%, nhanh hơn tổng tiền gửi khách hàng ${f2(pc(D.dep.y25,D.dep.y24))}%. Cơ cấu nguồn dịch chuyển sang phần chi phí thấp.`},

  why:()=>`Nợ xấu tăng ${f2(pc(D.nplAmt.y25,D.nplAmt.y24))}%, nhanh hơn tăng trưởng dư nợ ${f2(pc(D.loan.y25,D.loan.y24))}%. Chênh lệch tốc độ này đẩy tỷ lệ lên.`},
 {n:'Tỷ lệ bao phủ nợ xấu',short:'Bao phủ nợ xấu',inv:false,

 {n:'Dư nợ trên tiền gửi khách hàng',short:'Dư nợ / tiền gửi',inv:true,
  num:{n:'Dư nợ cho vay khách hàng',k:'loan'}, den:{n:'Tiền gửi khách hàng',k:'dep'},
  why:()=>`Dư nợ tăng ${f2(pc(D.loan.y25,D.loan.y24))}%, nhanh hơn tiền gửi khách hàng ${f2(pc(D.dep.y25,D.dep.y24))}%. Phần chênh phải bù bằng nguồn khác.`}];
let ratCur=3;
function ratVal(r,y){return D[r.num.k][y]/D[r.den.k][y]*100;}
function drawRatio(){
  document.getElementById('rrCapt').textContent='Cấu phần tính ra chỉ số · tỷ đồng';
  document.getElementById('rrTbl').innerHTML=
   '<thead><tr><th>Chỉ số</th><th class="n">2024</th><th class="n">2025</th><th class="n">Thay đổi</th></tr></thead><tbody>'+
   RATIOS.map((r,i)=>{const a=ratVal(r,'y24'),b=ratVal(r,'y25'),d0=b-a;
     const good=r.inv?d0<=0:d0>=0;
     return `<tr class="ratr${i===ratCur?' on':''}" onclick="ratSel(${i})" style="cursor:pointer">
       <td class="lb">${r.n}</td><td class="n">${f2(a)}%</td><td class="n">${f2(b)}%</td>
       <td class="n" style="color:${good?'var(--green)':'var(--warn)'}">${(d0>=0?'+':'−')+f2(Math.abs(d0))} điểm</td></tr>`;}).join('')+
   '</tbody>';
  const r=RATIOS[ratCur], a=ratVal(r,'y24'), b=ratVal(r,'y25'), d0=b-a;
  document.getElementById('rrNote').innerHTML=
   `<div class="fml"><div class="fmlh">Công thức · ${r.n}</div>
      <div class="fmlrow"><div class="fmlfrac">
        <span class="fnum">${r.num.n}</span><span class="fbar"></span><span class="fden">${r.den.n}</span></div>
        <span class="fmleq">=</span>
        <div class="fmlyr"><span class="fy">2024</span>
          <span class="fnum">${f(D[r.num.k].y24)}</span><span class="fbar"></span>
          <span class="fden">${f(D[r.den.k].y24)}</span><span class="fres">${f2(a)}%</span></div>
        <div class="fmlyr on"><span class="fy">2025</span>
          <span class="fnum">${f(D[r.num.k].y25)}</span><span class="fbar"></span>
          <span class="fden">${f(D[r.den.k].y25)}</span><span class="fres">${f2(b)}%</span></div>
      </div></div>
    <div class="note ${(r.inv?d0<=0:d0>=0)?'gold':'warn'}" style="margin-top:12px;font-size:13.5px">
      <b>Vì sao thay đổi ${(d0>=0?'+':'−')+f2(Math.abs(d0))} điểm.</b> ${r.why()}</div>`;
  // biểu đồ: tử số và mẫu số, mỗi cái tự chia thang
  const parts=[{t:'Tử số',o:r.num},{t:'Mẫu số',o:r.den}];
  document.getElementById('rrChart').innerHTML=
   `<div class="cclg"><span><i style="background:rgba(0,112,74,.32)"></i>2024</span>
     <span><i style="background:var(--green)"></i>2025</span></div>`+
   parts.map(p=>{const A=D[p.o.k].y24,B=D[p.o.k].y25,g=pc(B,A),mx=Math.max(A,B)*1.05;
     return `<div class="ccrow" style="margin-bottom:16px">
       <div class="mono" style="font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim)">${p.t}</div>
       <div class="ccn" style="margin:2px 0 5px">${p.o.n}
         <span class="mono" style="font-size:11px;color:${g>=0?'var(--green)':'var(--warn)'}">
         ${(g>=0?'+':'−')+f2(Math.abs(g))}%</span></div>
       <div class="ccbars" style="height:56px">
         <span class="ccb y24" style="height:${A/mx*100}%"></span>
         <span class="ccb y25" style="height:${B/mx*100}%"></span></div>
       <div class="ccv"><span>${f(A)}</span><span>${f(B)}</span></div></div>`;}).join('')+
   `<div class="ccgap">Chênh lệch tốc độ giữa tử số và mẫu số:
     <b>${(pc(D[r.num.k].y25,D[r.num.k].y24)-pc(D[r.den.k].y25,D[r.den.k].y24)>=0?'+':'−')
       +f2(Math.abs(pc(D[r.num.k].y25,D[r.num.k].y24)-pc(D[r.den.k].y25,D[r.den.k].y24)))} điểm phần trăm</b></div>`;
}

const BSITEMS=[
 {n:'Cho vay khách hàng',s:'Cho vay KH',k:'loan'},
 {n:'Tiền gửi khách hàng',s:'Tiền gửi KH',k:'dep'},
 {n:'Tiền gửi và vay các TCTD',s:'TG & vay TCTD',k:'tctd'},
 {n:'Phát hành giấy tờ có giá',s:'Giấy tờ có giá',k:'gtcg'},
 {n:'Nợ Chính phủ và NHNN',s:'Nợ CP & NHNN',k:'nocp'},
 {n:'Vốn chủ sở hữu',s:'Vốn chủ sở hữu',k:'equity'}];
const BSMIX=[
 {n:'Tiền gửi khách hàng',k:'dep',c:'var(--green)'},
 {n:'Tiền gửi và vay các TCTD',k:'tctd',c:'var(--warn)'},
 {n:'Phát hành giấy tờ có giá',k:'gtcg',c:'var(--gold)'},
 {n:'Nợ Chính phủ và NHNN',k:'nocp',c:'var(--forest)'},
 {n:'Vốn chủ sở hữu',k:'equity',c:'var(--teal)'}];
function drawBSChart(){
  document.getElementById('rrCapt').textContent='So sánh cấu phần và cơ cấu nguồn';
  const items=BSITEMS.slice(0,5);
  const mx=Math.max(...items.map(x=>Math.max(D[x.k].y24,D[x.k].y25)))*1.08;
  let g1=`<div class="cclg"><span><i style="background:rgba(0,112,74,.32)"></i>2024</span>
      <span><i style="background:var(--green)"></i>2025</span></div>
    <div class="gbc">`;
  items.forEach(x=>{
    const a=D[x.k].y24,b=D[x.k].y25,gr=pc(b,a);
    g1+=`<div class="gbcg">
      <div class="gbcb"><span class="gbcbar y24" style="height:${a/mx*100}%"></span></div>
      <div class="gbcb"><span class="gbcbar y25" style="height:${b/mx*100}%"></span></div>
      <div class="gbcn">${x.s}<br><span class="mono" style="color:${gr>=0?'var(--green)':'var(--warn)'};font-size:10.5px">
        ${(gr>=0?'+':'−')+f2(Math.abs(gr))}%</span></div></div>`;
  });
  g1+='</div>';
  // tỷ trọng trên tổng tài sản
  const rowMix=y=>{
    let out='',acc=0;
    BSMIX.forEach(m=>{const p=D[m.k][y]/D.ta[y]*100; acc+=p;
      out+=`<span class="mxs" style="width:${p}%;background:${m.c}" title="${m.n} ${f2(p)}%">
        ${p>7?f1(p)+'%':''}</span>`;});
    out+=`<span class="mxs" style="width:${100-acc}%;background:var(--line2)"></span>`;
    return out;
  };
  const g2=`<div class="mxwrap">
    <div class="mxrow"><span class="mxy">2024</span><span class="mxbar">${rowMix('y24')}</span></div>
    <div class="mxrow"><span class="mxy">2025</span><span class="mxbar">${rowMix('y25')}</span></div>
    <div class="mxlg">${BSMIX.map(m=>`<span><i style="background:${m.c}"></i>${m.n}
      <b class="mono">${f1(D[m.k].y24/D.ta.y24*100)}% → ${f1(D[m.k].y25/D.ta.y25*100)}%</b></span>`).join('')}
      <span><i style="background:var(--line2)"></i>Khác
      <b class="mono">${f1(100-BSMIX.reduce((s,m)=>s+D[m.k].y24/D.ta.y24*100,0))}% → ${f1(100-BSMIX.reduce((s,m)=>s+D[m.k].y25/D.ta.y25*100,0))}%</b></span></div>
    <div class="mxnote">Tỷ trọng trên tổng tài sản. Tiền gửi khách hàng giảm từ

/* ══════════ B4 · đối chiếu mức tăng lợi nhuận ══════════ */
const REC=[
 {n:'Thu nhập lãi thuần',k:'nii',core:true},
 {n:'Lãi thuần dịch vụ',k:'fee',core:true},
 {n:'Chi phí hoạt động',k:'opex',core:true,neg:true},
 {n:'Chi phí dự phòng rủi ro',k:'prov',core:true,neg:true},
 {n:'Lãi thuần hoạt động khác',k:'hdk',core:false},
 {n:'Lãi thuần kinh doanh ngoại hối',k:'fx',core:false},
 {n:'Lãi thuần mua bán chứng khoán',k:'sec',core:false},
 {n:'Thu từ góp vốn, mua cổ phần',k:'gv',core:false}];
let RECON=REC.map(()=>true);
INIT['B4']=function(){drawRec()};
function recDelta(i){const r=REC[i];const d=D[r.k].y25-D[r.k].y24;return r.neg?-d:d;}
function recAll(v){RECON=REC.map(()=>!!v);drawRec()}
function recCore(){RECON=REC.map((r,i)=>r.core);drawRec()}
function recTog(i){RECON[i]=!RECON[i];drawRec()}
function drawRec(){
  const tot=REC.reduce((s,r,i)=>s+(RECON[i]?recDelta(i):0),0);
  const base=D.pbt.y24, actual=D.pbt.y25-D.pbt.y24;
  document.getElementById('recTbl').innerHTML=
   '<thead><tr><th></th><th>Cấu phần</th><th class="n">2024</th><th class="n">2025</th>'+
   '<th class="n">Δ tuyệt đối</th><th class="n">Δ%</th></tr></thead><tbody>'+
   REC.map((r,i)=>{const a=D[r.k].y24,b=D[r.k].y25,d0=recDelta(i),g=pc(b,a);
     return `<tr class="${RECON[i]?'on':'off'}" onclick="recTog(${i})">
       <td class="ck"><span class="bx">${RECON[i]?'✓':''}</span></td>
       <td>${r.neg?'− ':''}${r.n}</td>
       <td class="v">${f(a)}</td><td class="v">${f(b)}</td>
       <td class="v" style="color:${d0>=0?'var(--green)':'var(--warn)'};font-weight:500">
         ${(d0>=0?'+':'−')+f(Math.abs(d0))}</td>
       <td class="v" style="color:${(r.neg?-g:g)>=0?'var(--green)':'var(--warn)'}">
         ${(g>=0?'+':'−')+f2(Math.abs(g))}%</td></tr>`;}).join('')+
   `<tr class="sum"><td class="ck"></td><td>Tổng các cấu phần đang chọn</td>
     <td class="v">—</td><td class="v">—</td>
     <td class="v" style="color:${tot>=0?'var(--green)':'var(--warn)'}">${(tot>=0?'+':'−')+f(Math.abs(tot))}</td>
     <td class="v" style="color:${tot>=0?'var(--green)':'var(--warn)'}">${(tot>=0?'+':'−')+f2(Math.abs(tot/base*100))}%</td></tr>`+
   '</tbody>';
  drawRecWf(tot);
  const nOff=RECON.filter(x=>!x).length, coreOnly=RECON.every((v,i)=>v===REC[i].core);
  let msg;
  if(nOff===0) msg=`<div class="note gold"><b>Đủ tám cấu phần: +${f(actual)} tỷ, tương đương +${f2(actual/base*100)}%.</b>
    Đây là mức tăng lợi nhuận trước thuế công bố — khớp với bảng ở chặng trước.</div>`;
  else if(coreOnly) msg=`<div class="note warn"><b>Chỉ giữ hoạt động lõi: ${(tot>=0?'+':'−')+f(Math.abs(tot))} tỷ,
    tương đương ${(tot>=0?'+':'−')+f2(Math.abs(tot/base*100))}%.</b> Thu nhập lãi thuần và dịch vụ trừ chi phí
    hoạt động và dự phòng. Đây là phần lặp lại được theo kế hoạch.</div>`;
  else if(!RECON[4]) msg=`<div class="note warn"><b>Bỏ lãi thuần hoạt động khác: ${(tot>=0?'+':'−')+f(Math.abs(tot))} tỷ.</b>
    Riêng cấu phần này đóng góp +${f(recDelta(4))} tỷ — lớn hơn toàn bộ mức tăng lợi nhuận ${f(actual)} tỷ.
    Phần dư của nó bù cho các cấu phần sụt giảm.</div>`;
  else msg=`<div class="note"><b>Tổng ${nOff} cấu phần bị loại: ${(tot>=0?'+':'−')+f(Math.abs(tot))} tỷ,
    tương đương ${(tot>=0?'+':'−')+f2(Math.abs(tot/base*100))}%.</b> Con số này chỉ có nghĩa khi nói rõ
    đang loại những gì.</div>`;
  document.getElementById('recMsg').innerHTML=msg;
}
function drawRecWf(tot){
  const base=D.pbt.y24, end=base+tot;
  const items=REC.map((r,i)=>({n:r.n,d:recDelta(i),on:RECON[i]}));
  // trục: từ 0, thang theo giá trị lớn nhất
  const peaks=[base]; let run=base;
  items.forEach(x=>{ if(x.on){run+=x.d; peaks.push(run);} });
  peaks.push(end);
  const mx=Math.max(...peaks)*1.06;
  let cum=base;
  const cols=[`<div class="wcol"><div class="wv">${f(base)}</div>
     <div class="wbar base" style="height:${base/mx*100}%"></div>
     <div class="wn">Lợi nhuận<br>2024</div></div>`];
  items.forEach(x=>{
    const st=x.on?cum:cum, h0=Math.abs(x.d)/mx*100;
    const bot=x.on?(x.d>=0?cum:cum+x.d):cum;
    if(x.on)cum+=x.d;
    cols.push(`<div class="wcol">
      <div class="wv" style="color:${x.d>=0?'var(--green)':'var(--warn)'};opacity:${x.on?1:.35}">
        ${(x.d>=0?'+':'−')+f(Math.abs(x.d))}</div>
      <div class="wbar ${x.d>=0?'up':'dn'}${x.on?'':' dim'}"
        style="height:${h0}%;margin-bottom:${bot/mx*100}%"></div>
      <div class="wn" style="opacity:${x.on?1:.35}">${x.n.replace('Lãi thuần ','').replace('Chi phí ','CP ')}</div></div>`);
  });
  cols.push(`<div class="wcol"><div class="wv">${f(end)}</div>
    <div class="wbar base" style="height:${end/mx*100}%"></div>
    <div class="wn">Kết quả<br>đang chọn</div></div>`);
  document.getElementById('recWf').innerHTML=cols.join('');
}

      {k:'rCof',n:'Chi phí vốn tiền gửi bình quân',u:'%',min:3,max:4.5,st:0.01}],
  eq:()=>`<b>${f(LA)}</b> <span class="op">×</span> <b>${f2(ANAT.rLend)}%</b> <span class="op">−</span> <b>${f(DA)}</b> <span class="op">×</span> <b>${f2(ANAT.rCof)}%</b> <span class="op">+</span> <b>${f(NII_RESID)}</b> <span class="op">=</span> <b>${f(LA*ANAT.rLend/100-DA*ANAT.rCof/100+NII_RESID)}</b>`,
  note:'Dòng <b>+'+f(NII_RESID)+'</b> là lãi thuần từ chứng khoán nợ và tiền gửi liên ngân hàng, trừ chi phí giấy tờ có giá và tiền vay.'},
 {id:2,n:'Lãi thuần dịch vụ',kind:1,
  base:'Tổng tài sản '+f(D.ta25)+' tỷ · nền khách hàng hiện hữu',
  why:'Cơ sở là <b>nền khách hàng và tần suất giao dịch</b>. Nền khách hàng không biến mất sau một năm, nên khoản này lặp lại được — dù tỷ suất có thể cải thiện hoặc xấu đi.',
  val:()=>D.ta25*ANAT.feeR/100,
  sl:[{k:'feeR',n:'Thu dịch vụ trên tổng tài sản',u:'%',min:0.10,max:0.30,st:0.005,dec:3}],
  eq:()=>`<b>${f(D.ta25)}</b> <span class="op">×</span> <b>${ANAT.feeR.toFixed(3).replace('.',',')}%</b> <span class="op">=</span> <b>${f(D.ta25*ANAT.feeR/100)}</b>`},
 {id:3,n:'Ngoại hối, chứng khoán và góp vốn',kind:2,
  base:'Danh mục đầu tư và doanh số giao dịch — cơ sở còn nguyên, nhưng giá do thị trường',
  why:'Cơ sở <b>không bị tiêu hao</b>, danh mục vẫn còn đó. Nhưng kết quả phụ thuộc mặt bằng lãi suất, tỷ giá và thời điểm chốt lời — <b>ngân hàng không kiểm soát được</b>. Bằng chứng: nhóm này giảm 36,5% chỉ trong một năm.',
  val:()=>(D.fx.y25+D.sec.y25+D.gv.y25)*ANAT.mktIdx/100,
  sl:[{k:'mktIdx',n:'So với mức thực hiện 2025',u:'%',min:0,max:200,st:5}],
  eq:()=>`<b>${f(D.fx.y25+D.sec.y25+D.gv.y25)}</b> <span class="op">×</span> <b>${ANAT.mktIdx}%</b> <span class="op">=</span> <b>${f((D.fx.y25+D.sec.y25+D.gv.y25)*ANAT.mktIdx/100)}</b>`,
  note:'Năm 2024 nhóm này là <b>'+f(D.fx.y24+D.sec.y24+D.gv.y24)+' tỷ</b>, năm 2025 còn <b>'+f(D.fx.y25+D.sec.y25+D.gv.y25)+' tỷ</b>. Kéo thanh để thấy khoảng dao động thực tế đã xảy ra.'},
 {id:4,n:'Chi phí hoạt động',kind:1,neg:true,
  base:D.staff.toLocaleString('vi-VN')+' nhân sự · mạng lưới chi nhánh',
  why:'Cơ sở là <b>nhân sự và mạng lưới</b> — cũng có quán tính như bảng cân đối. Chi phí không biến mất sau một năm, và cũng không cắt được nhanh.',
  val:()=>D.staff*ANAT.opexPP,
  sl:[{k:'opexPP',n:'Chi phí hoạt động trên mỗi nhân sự',u:' tỷ',min:0.9,max:1.3,st:0.005,dec:3}],
  eq:()=>`<b>${D.staff.toLocaleString('vi-VN')}</b> <span class="op">×</span> <b>${ANAT.opexPP.toFixed(3).replace('.',',')}</b> <span class="op">=</span> <b>${f(D.staff*ANAT.opexPP)}</b>`},
 {id:5,n:'Chi phí dự phòng rủi ro',kind:1,neg:true,
  base:'Dư nợ bình quân '+f(LA)+' tỷ × chi phí rủi ro tín dụng',
  why:'Trích lập sinh ra từ <b>dư nợ và chất lượng danh mục</b>. Đây là khoản chi, nhưng nó tạo ra hai nhánh vòng ngược ở lớp sau.',
  val:()=>LA*ANAT.ccost/100,
  sl:[{k:'ccost',n:'Chi phí rủi ro tín dụng trên dư nợ bình quân',u:'%',min:0.5,max:1.5,st:0.01}],
  eq:()=>`<b>${f(LA)}</b> <span class="op">×</span> <b>${f2(ANAT.ccost)}%</b> <span class="op">=</span> <b>${f(LA*ANAT.ccost/100)}</b>`},
 {id:6,n:'Hoàn nhập dự phòng và thu hồi nợ đã xử lý',kind:3,
  base:'Số dư dự phòng đã trích '+f(CAP_REV)+' tỷ · trữ lượng nợ đã xử lý rủi ro',
  why:'<b>Khác về bản chất với mọi lớp trên.</b> Cơ sở không tự tái tạo — nó là một trữ lượng đã hình thành từ quá khứ. Khai thác đồng nào thì vơi đồng đó. Và nó có <b>trần tuyệt đối</b>: không thể hoàn nhập nhiều hơn số đã trích.',
  val:()=>ANAT.reversal+ANAT.recover,
  sl:[{k:'reversal',n:'Hoàn nhập dự phòng',u:' tỷ',min:0,max:Math.round(CAP_REV),st:500,cap:CAP_REV,
       capn:'Trần = số dư dự phòng đầu kỳ '+f(CAP_REV)+' tỷ'},
      {k:'recover',n:'Thu hồi nợ đã xử lý rủi ro',u:' tỷ',min:0,max:30000,st:500,cap:CAP_REC,
       capn:'Trữ lượng hình thành 2024–2025: '+f(CAP_REC)+' tỷ'}],
  eq:()=>`<b>${f(ANAT.reversal)}</b> <span class="op">+</span> <b>${f(ANAT.recover)}</b> <span class="op">=</span> <b>${f(ANAT.reversal+ANAT.recover)}</b>`,
  note:'Thực tế 2025: lãi thuần hoạt động khác <b>'+f(D.hdk.y25)+' tỷ</b>, phần lớn là thu hồi nợ đã xử lý. Mốc so sánh ở đây là số dự phòng đã dùng để xử lý rủi ro trong hai năm 2024 và 2025 — phần trữ lượng hình thành trong kỳ. Số dư lũy kế ngoài bảng không được công bố trên báo cáo riêng.'}
];
const KN={1:['LẶP LẠI ĐƯỢC','k1'],2:['KHÔNG LẶP LẠI','k2'],3:['KHÔNG LẶP LẠI · CÓ TRẦN','k3']};
INIT['C1']=function(){drawAnat()};
function anatNext(){ if(anatLv<LAYERS.length){anatLv++;drawAnat();} }
function anatReset(){anatLv=1;drawAnat()}
function drawAnat(){
  let run=0;
  document.getElementById('stack').innerHTML=LAYERS.map((L,i)=>{
    const on=i<anatLv, v=L.val(), sv=L.neg?-v:v;
    if(on)run+=sv;
    return `<div class="lay${on?' on':''}${i===anatLv-1?' act':''}${L.neg?' neg':''}" onclick="anatSel(${i})" style="cursor:pointer">
      <div class="lh"><span class="ln">${L.neg?'− ':''}${L.n}</span>
        <span class="lv">${L.neg?'−':''}${f(v)}</span></div>
      <div class="lh" style="margin-top:5px"><span class="kind ${KN[L.kind][1]}">${KN[L.kind][0]}</span>
        <span class="lb">${L.base.length>52?L.base.slice(0,52)+'…':L.base}</span></div></div>`;
  }).join('')+
  `<div class="lay on sum"><div class="lh"><span class="ln">Lợi nhuận trước thuế</span>
     <span class="lv">${f(run)}</span></div>
     <div class="lb">thực hiện 2025: ${f(D.pbt.y25)} tỷ${anatLv>=LAYERS.length&&Math.abs(run-D.pbt.y25)>50?' · lệch '+f(run-D.pbt.y25):(anatLv<LAYERS.length?' · còn '+(LAYERS.length-anatLv)+' lớp chưa mở':'')}</div></div>`;
  document.getElementById('anatStep').textContent='lớp '+anatLv+' / '+LAYERS.length;
  document.getElementById('anatNext').disabled=anatLv>=LAYERS.length;
  drawPanel();
}
function anatSel(i){ if(i<anatLv){anatLv=i+1;drawAnat();} }
function drawPanel(){
  const L=LAYERS[anatLv-1];
  document.getElementById('anatPanel').innerHTML=
   `<div class="basebox">
     <div style="display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap">
       <h4>${L.n}</h4><span class="kind ${KN[L.kind][1]}">${KN[L.kind][0]}</span></div>
     <div class="mono" style="font-size:11px;color:var(--dim)">Cơ sở: ${L.base}</div>
     <div class="bwhy">${L.why}</div>
     <div class="eqn">${L.eq()}</div>
     ${L.sl.map((s,k)=>{
       const val=ANAT[s.k], dec=s.dec||2;
       const capped=s.cap!=null;
       return `<div class="sld" style="margin-bottom:12px"><div class="row">
         <label>${s.n}</label><span class="v">${s.u===' tỷ'?f(val):val.toFixed(dec).replace('.',',')}${s.u}</span></div>
         <input type="range" min="${s.min}" max="${s.max}" step="${s.st}" value="${val}"
           oninput="anatSet('${s.k}',this.value)">
         ${capped?`<div class="capbar"><div class="ct2">
            <span class="cf${val>=s.cap*0.995?' over':''}" style="width:${Math.min(100,val/s.cap*100)}%"></span></div>
            <div class="cl2"><span>${s.capn}</span><span>${f1(val/s.cap*100)}% của trần</span></div></div>`:''}
        </div>`;}).join('')}
     ${L.note?`<div class="note" style="font-size:13px;margin-top:4px">${L.note}</div>`:''}
     ${L.kind===3?`<div class="note warn" style="font-size:13px;margin-top:10px">
       <b>Kéo hết thanh hoàn nhập để thấy chốt chặn.</b> Dù muốn đến đâu, không thể hoàn nhập
       nhiều hơn số dự phòng đã trích. Mọi lớp trên đều có thể tăng nếu cơ sở lớn lên —
       riêng lớp này thì cơ sở <b>chỉ nhỏ đi khi khai thác</b>.</div>`:''}
   </div>`;
}
function anatSet(k,v){ANAT[k]=+v;drawAnat()}

/* --- màn 10: cơ cấu nguồn + chuỗi --- */
INIT['C2']=function(){
  const F=[['Tiền gửi khách hàng',D.dep.y25,D.dep.y24,'var(--green)'],
           ['Tiền gửi và vay các TCTD',D.tctd.y25,D.tctd.y24,'var(--warn)'],
           ['Phát hành giấy tờ có giá',D.gtcg.y25,D.gtcg.y24,'var(--gold)'],
           ['Nợ Chính phủ và NHNN',D.nocp.y25,D.nocp.y24,'var(--forest)']];
  const mx=Math.max(...F.map(x=>x[1]));
  document.getElementById('fund').innerHTML=F.map(x=>{
    const g=pc(x[1],x[2]);
    return `<div class="frow"><div class="fn">${x[0]}</div>
      <div class="fw"><span class="fb" style="width:${x[1]/mx*100}%;background:${x[3]}"></span></div>
      <div class="fv">${f(x[1])}</div>
      <div class="fg" style="color:${g>40?'var(--warn)':'var(--green)'}">${sg(g)}</div></div>`;}).join('');
};
function drawChain(){
  const g=+document.getElementById('depG').value;
  document.getElementById('depGV').textContent='+'+f2(g)+'%';
  const loanG=5.50;
  const dep=D.dep.y25*(1+g/100), loan=D.loan.h1;
  const ldr=loan/dep*100;
  // dòng tiền: mỗi điểm % tiền gửi hụt so với thực tế -> thiếu nguồn tương ứng
  const cf=D.cf.h126+(g-1.85)/100*D.dep.y25;
  const gap=loanG-g;
  document.getElementById('chain').innerHTML=
   `<div class="ci ${gap>2?'alert':''}"><div class="cl">1 · Chênh lệch tốc độ</div>
      <div class="cv">${Math.abs(gap)<0.005?'':(gap>=0?'−':'+')}${f2(Math.abs(gap))} đ%</div>
      <div class="cs">Dư nợ tăng ${f2(loanG)}% · tiền gửi tăng ${f2(g)}%</div></div>
    <div class="ci ${ldr>107?'alert':''}"><div class="cl">2 · Dư nợ trên tiền gửi</div>
      <div class="cv">${f2(ldr)}%</div>
      <div class="cs">Cuối 2025: ${f2(D.ldr.y25)}% · tỷ lệ thô</div></div>
    <div class="ci ${cf<0?'alert':''}"><div class="cl">3 · Lưu chuyển tiền từ hoạt động kinh doanh</div>
      <div class="cv">${cf<0?'−':'+'}${f(Math.abs(cf))}</div>
      <div class="cs">Cùng kỳ 2025: +${f(D.cf.h125)} tỷ</div></div>`;
}

/* --- màn 12: độ nhạy --- */
const TOR=[
 {n:'Lãi suất cho vay bình quân',u:'điểm %',r:0.25,st:0.05,mx:0.6,
  imp:x=>loanAvg()*x/100, dir:1},
 {n:'Chi phí rủi ro tín dụng',u:'điểm %',r:0.25,st:0.05,mx:0.6,
  imp:x=>loanAvg()*x/100, dir:-1},
 {n:'Lãi suất huy động có kỳ hạn',u:'điểm %',r:0.25,st:0.05,mx:0.6,
  imp:x=>depAvg()*(1-D.casa.y25/100)*x/100, dir:-1},
 {n:'Tỷ lệ tiền gửi không kỳ hạn',u:'điểm %',r:2,st:0.5,mx:5,
  imp:x=>depAvg()*(D.rate.term-D.rate.casa)/100*x/100, dir:1},
 {n:'Tăng trưởng dư nợ',u:'điểm %',r:3,st:0.5,mx:8,
  imp:x=>D.loan.y25*x/200*(D.rate.lend-0.97)/100, dir:1},
 {n:'Tăng trưởng chi phí hoạt động',u:'điểm %',r:5,st:1,mx:15,
  imp:x=>D.opex.y25*x/100, dir:-1},
 {n:'Tăng trưởng thu dịch vụ',u:'điểm %',r:10,st:1,mx:25,
  imp:x=>D.fee.y25*x/100, dir:1}];
function loanAvg(){return (D.loan.y24+D.loan.y25)/2}
function depAvg(){return (D.dep.y24+D.dep.y25)/2}
INIT['C4']=function(){
  const c=document.getElementById('torCtl');
  if(!c.children.length){
    c.innerHTML='<div class="eyebrow" style="margin-bottom:10px">Biên độ dao động hợp lý trong một năm</div>'+
      TOR.map((t,i)=>`<div class="sld" style="margin-bottom:9px"><div class="row">
        <label>${t.n}</label><span class="v" id="tv${i}">±${t.r}</span></div>
        <input type="range" id="ti${i}" min="0" max="${t.mx}" step="${t.st}" value="${t.r}"></div>`).join('');
    TOR.forEach((t,i)=>document.getElementById('ti'+i).addEventListener('input',e=>{
      TOR[i].r=+e.target.value; drawTor();}));
  }
  drawTor();
};
function drawTor(){
  const rows=TOR.map(t=>({n:t.n,u:t.u,r:t.r,v:t.imp(t.r),d:t.dir}))
                .sort((a,b)=>b.v-a.v);
  const mx=Math.max(...rows.map(r=>r.v))||1;
  document.getElementById('tor').innerHTML=rows.map(r=>{
    const w=r.v/mx*46;
    return `<div class="trow"><div class="tn">${r.n}</div>
      <div class="tmid"><div class="taxis"></div>
        <div class="tb pos" style="width:${w}%"></div>
        <div class="tb neg" style="width:${w}%"></div></div>
      <div class="tv">±${f(r.v)}</div>
      <div class="tr">±${r.r} ${r.u}</div></div>`;}).join('');
  TOR.forEach((t,i)=>{const e=document.getElementById('tv'+i);if(e)e.textContent='±'+t.r;});
  const top=rows[0], loanRow=rows.find(r=>r.n.indexOf('Tăng trưởng dư nợ')>=0);
  const rank=rows.indexOf(loanRow)+1;
  document.getElementById('torNote').innerHTML=
   `<div class="note gold"><b>Đòn bẩy mạnh nhất hiện tại: ${top.n}</b> — dao động ±${top.r} ${top.u}
    làm lợi nhuận trước thuế đổi khoảng <b class="mono">${f(top.v)} tỷ</b>.
    <br><br>Tăng trưởng dư nợ đứng thứ <b>${rank}</b> trong bảng xếp hạng này.
    ${rank>2?'Quy mô không phải đòn bẩy mạnh nhất — giá và chi phí rủi ro chi phối kết quả nhiều hơn.':''}
    </div>
    <div class="note" style="margin-top:12px;font-size:13px"><b>Cách đọc:</b> mỗi thanh là mức thay đổi
    lợi nhuận trước thuế khi tham số đó lệch khỏi giả định một biên độ hợp lý, các tham số khác giữ nguyên.
    Tính trên nền dư nợ và tiền gửi bình quân của năm 2025.</div>`;
}

show(0);
</script>
