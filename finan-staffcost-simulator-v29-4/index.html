<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Finan · Staff Cost Simulator T6/2026 v29</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Sora:wght@400;600;700;800&display=swap');
:root{
  --bg:#080E18;--surface:#0E1826;--card:#131F30;--border:#1E3048;--border2:#243A56;
  --text:#C8D8E8;--sub:#6A8AAA;--dim:#3A5470;
  --gold:#E8B84B;--gold2:#F5D07A;--goldfade:rgba(232,184,75,.12);
  --teal:#29C4B0;--tealfade:rgba(41,196,176,.1);
  --red:#E05555;--redfade:rgba(224,85,85,.1);
  --green:#38C870;--greenfade:rgba(56,200,112,.1);
  --amber:#F09030;--purple:#9B72E8;--blue:#4A9EE8;
  --fh:'Sora',sans-serif;--fm:'DM Mono',monospace;
  --bu1:#29C4B0;--bu2:#9B72E8;--bu3:#4A9EE8;--bu4:#E8B84B;--bu5:#E05555;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:var(--fh);font-size:12.5px;line-height:1.5;overflow-x:hidden}
.hdr{background:linear-gradient(180deg,#0A1220,var(--bg));border-bottom:1px solid var(--border);padding:14px 24px 10px;position:sticky;top:0;z-index:100;backdrop-filter:blur(8px)}
.hdr-top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.hdr-title{font-size:15px;font-weight:800;color:#fff;letter-spacing:-.3px}
.hdr-title span{color:var(--gold)}
.hdr-sub{font-size:10px;color:var(--sub);margin-top:1px;font-family:var(--fm)}
.hdr-actions{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:4px;padding:5px 11px;border-radius:4px;font-family:var(--fh);font-size:11px;font-weight:700;cursor:pointer;border:none;transition:all .15s;letter-spacing:.3px}
.btn-ghost{background:transparent;border:1px solid var(--border2);color:var(--sub)}
.btn-ghost:hover{border-color:var(--gold);color:var(--gold)}
.btn-teal{background:var(--teal);color:#080E18}.btn-teal:hover{opacity:.85}
.btn-red{background:var(--redfade);border:1px solid rgba(224,85,85,.3);color:var(--red)}.btn-red:hover{background:rgba(224,85,85,.2)}
.menu-wrap{position:relative;display:inline-block}
.menu-pop{position:absolute;top:calc(100% + 4px);right:0;background:var(--card);border:1px solid var(--border2);border-radius:6px;padding:5px;min-width:185px;z-index:150;box-shadow:0 8px 24px rgba(0,0,0,.5);display:none}
.menu-pop.open{display:block}
.menu-item{display:flex;align-items:center;gap:7px;width:100%;padding:7px 10px;border:none;background:none;color:var(--text);font-family:var(--fh);font-size:11px;font-weight:600;text-align:left;cursor:pointer;border-radius:4px;transition:background .12s}
.menu-item:hover{background:var(--surface)}
.menu-item.danger{color:var(--red)}.menu-item.danger:hover{background:var(--redfade)}
.menu-item .mi-sub{display:block;font-size:9px;color:var(--dim);font-weight:400;font-family:var(--fm);margin-top:1px}
.menu-divider{height:1px;background:var(--border);margin:4px 6px}
/* ===== SIDEBAR LAYOUT ===== */
.app-shell{display:flex;min-height:100vh}
.sidebar{width:180px;flex-shrink:0;background:linear-gradient(180deg,#0A1220,var(--surface));border-right:1px solid var(--border);display:flex;flex-direction:column;position:fixed;top:0;left:0;bottom:0;z-index:90;overflow-y:auto}
.sidebar::-webkit-scrollbar{width:4px}.sidebar::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px}
.sb-brand{padding:16px 16px 12px;border-bottom:1px solid var(--border)}
.sb-brand-title{font-size:13px;font-weight:800;color:#fff;letter-spacing:-.2px;line-height:1.3}
.sb-brand-title span{color:var(--gold)}
.sb-brand-ver{font-size:9px;color:var(--sub);font-family:var(--fm);margin-top:3px}
.sb-section{padding:12px 10px 4px}
.sb-section-lbl{font-size:8px;font-weight:700;color:var(--dim);letter-spacing:1.5px;text-transform:uppercase;padding:0 8px 6px;font-family:var(--fm)}
.sb-item{display:flex;align-items:center;gap:9px;width:100%;padding:9px 12px;border:none;background:none;color:var(--sub);font-family:var(--fh);font-size:12px;font-weight:600;text-align:left;cursor:pointer;border-radius:6px;transition:all .12s;margin-bottom:2px}
.sb-item:hover{background:var(--card);color:var(--text)}
.sb-item.active{background:var(--goldfade);color:var(--gold)}
.sb-item.active .sb-ico{opacity:1}
.sb-ico{font-size:14px;opacity:.7;width:18px;text-align:center}
.sb-item.teal-item{color:var(--teal)}.sb-item.teal-item:hover{background:var(--tealfade)}
.sb-item.danger-item{color:var(--red)}.sb-item.danger-item:hover{background:var(--redfade)}
.sb-spacer{flex:1}
.sb-footer{padding:10px 16px;border-top:1px solid var(--border);font-size:9px;color:var(--dim);font-family:var(--fm)}
.main-area{flex:1;margin-left:180px;min-width:0;display:flex;flex-direction:column}
.sb-pop{position:absolute;left:calc(100% - 6px);background:var(--card);border:1px solid var(--border2);border-radius:8px;padding:6px;min-width:230px;z-index:160;box-shadow:0 8px 28px rgba(0,0,0,.55);display:none}
.sb-pop.open{display:block}
.sb-menu-wrap{position:relative}
.tabs-bar{background:var(--surface);border-bottom:2px solid var(--border);padding:0 24px;display:flex;gap:0}
.tab-btn{padding:9px 18px;font-size:11px;font-weight:700;color:var(--sub);background:none;border:none;cursor:pointer;letter-spacing:.5px;border-bottom:2px solid transparent;margin-bottom:-2px;transition:all .15s}
.tab-btn:hover{color:var(--text)}
.tab-btn.active{color:var(--gold);border-bottom-color:var(--gold)}
.strip{background:var(--surface);border-bottom:1px solid var(--border);padding:9px 24px;display:flex;gap:0;overflow-x:auto}
.kpi{padding:0 16px;border-right:1px solid var(--border);text-align:center;white-space:nowrap;min-width:90px}
.kpi:first-child{padding-left:0}.kpi:last-child{border-right:none}
.kpi-lbl{font-size:9px;color:var(--sub);letter-spacing:1.2px;text-transform:uppercase;font-family:var(--fm)}
.kpi-val{font-family:var(--fm);font-size:13px;font-weight:500;color:var(--gold);margin-top:1px}
.kpi-val.green{color:var(--green)}.kpi-val.teal{color:var(--teal)}.kpi-val.red{color:var(--red)}.kpi-val.amber{color:var(--amber)}
.kpi-sub{font-size:9px;color:var(--dim);margin-top:1px}
.toolbar{background:var(--surface);border-bottom:1px solid var(--border);padding:7px 24px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.search-box{position:relative;flex:1;min-width:160px;max-width:240px}
.search-box input{width:100%;background:var(--card);border:1px solid var(--border2);border-radius:4px;padding:5px 9px 5px 26px;color:var(--text);font-family:var(--fm);font-size:11px}
.search-box input:focus{outline:none;border-color:var(--teal)}
.search-box::before{content:"⌕";position:absolute;left:7px;top:50%;transform:translateY(-50%);color:var(--dim);font-size:14px;pointer-events:none}
.filter-sel{background:var(--card);border:1px solid var(--border2);border-radius:4px;padding:5px 7px;color:var(--text);font-family:var(--fm);font-size:11px;cursor:pointer}
.filter-sel:focus{outline:none;border-color:var(--teal)}
.alloc-hint{font-size:10px;color:var(--sub);margin-left:auto}
.alloc-hint strong{color:var(--amber)}
.page{display:none}.page.active{display:block}
.tbl-outer{overflow-x:auto;overflow-y:auto;max-height:calc(100vh - 150px)}
.tbl-outer::-webkit-scrollbar{height:6px;width:6px}
.tbl-outer::-webkit-scrollbar-track{background:var(--bg)}
.tbl-outer::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px}
table.sim{border-collapse:collapse;width:max-content;min-width:100%}
table.sim th{background:var(--surface);color:var(--sub);font-family:var(--fm);font-size:9px;font-weight:500;letter-spacing:.8px;text-transform:uppercase;padding:7px 9px;border-bottom:2px solid var(--border2);white-space:nowrap;position:sticky;top:0;z-index:10;text-align:right}
table.sim th.left{text-align:left}
table.sim th.center{text-align:center}
table.sim th:nth-child(1),table.sim td:nth-child(1){position:sticky;left:0;z-index:12;background:inherit}
table.sim th:nth-child(1){background:var(--surface);z-index:20}
.th-bu1{color:var(--bu1)!important}.th-bu2{color:var(--bu2)!important}.th-bu3{color:var(--bu3)!important}.th-bu4{color:var(--bu4)!important}.th-bu5{color:var(--bu5)!important}
.th-out1{background:rgba(41,196,176,.05)!important;color:var(--bu1)!important}
.th-out2{background:rgba(155,114,232,.05)!important;color:var(--bu2)!important}
.th-out3{background:rgba(74,158,232,.05)!important;color:var(--bu3)!important}
.th-out4{background:rgba(232,184,75,.05)!important;color:var(--bu4)!important}
.th-out5{background:rgba(224,85,85,.05)!important;color:var(--bu5)!important}
.th-sep{border-left:1px solid var(--border2)!important}
tr.dept-hdr{background:var(--card)}
tr.dept-hdr td{font-size:10px;font-weight:700;color:var(--gold);text-transform:uppercase;letter-spacing:1.2px;padding:9px 10px 6px;border-top:2px solid var(--border2);border-bottom:1px solid var(--border)}
tr.dept-hdr td:first-child{border-left:3px solid var(--gold)}
tr.person-row{background:var(--bg);transition:background .1s}
tr.person-row:hover{background:#0C1520}
tr.person-row.inactive-row{opacity:.4}
tr.person-row td{border-bottom:1px solid var(--border);padding:5px 9px;vertical-align:middle;text-align:right}
tr.person-row td.left{text-align:left}
tr.person-row td.center{text-align:center}
tr.new-row td{background:rgba(41,196,176,.03);border-bottom:1px solid rgba(41,196,176,.12)}
tr.out-row td{background:rgba(155,114,232,.03)}
tr.dept-total{background:var(--card)}
tr.dept-total td{padding:6px 9px;text-align:right;border-bottom:2px solid var(--border2);font-family:var(--fm);font-size:11px;font-weight:500;color:var(--gold);border-top:1px solid var(--border2)}
tr.dept-total td:first-child{text-align:left;font-size:10px;letter-spacing:.5px}
tr.grand-total{background:var(--surface)}
tr.grand-total td{padding:8px 9px;text-align:right;border-top:2px solid var(--gold);font-family:var(--fm);font-size:12px;font-weight:500;color:var(--gold2);position:sticky;bottom:0;z-index:9}
tr.grand-total td:first-child{text-align:left;font-size:11px;font-weight:700}
.inp-adj{width:72px;background:var(--card);border:1px solid var(--border2);border-radius:3px;padding:3px 6px;color:var(--text);font-family:var(--fm);font-size:11px;text-align:right}
.inp-adj:focus{outline:none;border-color:var(--teal);background:#0E1F30}
.inp-alloc{width:50px;background:transparent;border:1px solid transparent;border-radius:3px;padding:3px 4px;color:var(--text);font-family:var(--fm);font-size:11px;text-align:center;transition:border .1s}
.inp-alloc:focus{outline:none;border-color:var(--teal);background:var(--card)}
.inp-alloc.bu1:focus{border-color:var(--bu1)}.inp-alloc.bu2:focus{border-color:var(--bu2)}.inp-alloc.bu3:focus{border-color:var(--bu3)}.inp-alloc.bu4:focus{border-color:var(--bu4)}.inp-alloc.bu5:focus{border-color:var(--bu5)}
.inp-alloc.over{background:rgba(224,85,85,.12);border-color:rgba(224,85,85,.4)!important;color:var(--red)!important}
.inp-alloc.full{background:rgba(56,200,112,.07);border-color:rgba(56,200,112,.25)}
.inp-alloc.dim-bu{opacity:.22;background:rgba(255,255,255,.01)}
.alloc-sum{display:inline-block;min-width:28px;text-align:center;font-family:var(--fm);font-size:10px;border-radius:2px;padding:1px 4px}
.alloc-sum.ok{background:rgba(56,200,112,.15);color:var(--green)}.alloc-sum.over{background:rgba(224,85,85,.15);color:var(--red)}.alloc-sum.zero{color:var(--dim)}
.status-toggle{cursor:pointer;padding:2px 7px;border-radius:3px;font-family:var(--fm);font-size:10px;font-weight:500;border:none;transition:all .15s;white-space:nowrap}
.status-toggle.active{background:rgba(56,200,112,.15);color:var(--green);border:1px solid rgba(56,200,112,.3)}
.status-toggle.inactive{background:rgba(224,85,85,.1);color:var(--red);border:1px solid rgba(224,85,85,.2)}
.del-btn{background:rgba(224,85,85,.12);border:1px solid rgba(224,85,85,.2);color:var(--red);border-radius:3px;padding:2px 6px;cursor:pointer;font-size:11px;font-family:var(--fm);line-height:1}
.del-btn:hover{background:rgba(224,85,85,.25)}
.pl-select{background:var(--card);border:1px solid var(--border2);border-radius:3px;padding:2px 5px;color:var(--sub);font-family:var(--fm);font-size:9px;max-width:185px;cursor:pointer}
.pl-select:focus{outline:none;border-color:var(--purple);color:var(--text)}
.name-cell{display:flex;flex-direction:column;min-width:155px}
.name-main{font-weight:600;color:#fff;font-size:12px}
.name-pos{font-size:9px;color:var(--sub);margin-top:1px}
.name-tag{font-size:9px;font-family:var(--fm)}
.name-tag.new{color:var(--teal)}
.name-tag.out{color:var(--purple)}
.name-tag.prb{color:var(--amber)}
.out-val{font-family:var(--fm);font-size:11px}
.out-val.has-val{font-weight:500}
.out-val.bu1{color:var(--bu1)}.out-val.bu2{color:var(--bu2)}.out-val.bu3{color:var(--bu3)}.out-val.bu4{color:var(--bu4)}.out-val.bu5{color:var(--bu5)}
.summary-wrap{padding:20px 24px;display:flex;flex-direction:column;gap:20px}
.sec-title{font-size:11px;font-weight:700;color:var(--gold);letter-spacing:2px;text-transform:uppercase;padding-bottom:8px;border-bottom:1px solid rgba(232,184,75,.2);margin-bottom:12px}
.sum-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.sum-box{background:var(--surface);border:1px solid var(--border2);border-radius:4px;overflow-x:auto}
.sum-tbl{width:100%;border-collapse:collapse;font-size:11.5px}
.sum-tbl th{background:rgba(232,184,75,.07);font-family:var(--fm);font-size:9px;font-weight:500;color:var(--sub);text-transform:uppercase;letter-spacing:.8px;padding:7px 10px;text-align:right;border-bottom:1px solid var(--border2);white-space:nowrap}
.sum-tbl th:first-child{text-align:left}
.sum-tbl td{padding:6px 10px;border-bottom:1px solid rgba(255,255,255,.03);text-align:right;font-family:var(--fm);white-space:nowrap}
.sum-tbl td:first-child{text-align:left;color:var(--text);font-weight:600}
.sum-tbl tr:hover td{background:rgba(255,255,255,.02)}
.sum-tbl tr.sum-total td{background:rgba(232,184,75,.07);color:var(--gold2);font-weight:700;border-top:2px solid rgba(232,184,75,.25);border-bottom:none}
.sum-tbl tr.sum-total td:first-child{text-align:left}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:200;display:none;align-items:center;justify-content:center;backdrop-filter:blur(4px)}
.modal-overlay.open{display:flex}
.modal{background:var(--card);border:1px solid var(--border2);border-radius:8px;padding:22px;width:500px;max-width:95vw;max-height:90vh;overflow-y:auto}
.modal h2{font-size:14px;font-weight:800;color:var(--gold);margin-bottom:14px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.form-field{display:flex;flex-direction:column;gap:3px}
.form-field.full{grid-column:1/-1}
.form-field label{font-size:10px;color:var(--sub);font-family:var(--fm);letter-spacing:.5px;text-transform:uppercase}
.form-field input,.form-field select{background:var(--surface);border:1px solid var(--border2);border-radius:4px;padding:6px 9px;color:var(--text);font-family:var(--fm);font-size:12px}
.form-field input:focus,.form-field select:focus{outline:none;border-color:var(--teal)}
.form-field input[readonly]{background:rgba(41,196,176,.05);border-color:rgba(41,196,176,.2);color:var(--teal)}
.modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px}
</style>
</head>
<body>

<div class="app-shell">
<aside class="sidebar">
  <div class="sb-brand">
    <div class="sb-brand-title">FINAN<br><span>Staff Cost</span></div>
    <div class="sb-brand-ver">Simulator · T6/2026 · v29</div>
  </div>

  <div class="sb-section">
    <div class="sb-section-lbl">Navigation</div>
    <button class="sb-item active" id="nav-simulator" onclick="showTab('simulator',this)"><span class="sb-ico">📋</span> Simulator</button>
    <button class="sb-item" id="nav-summary" onclick="showTab('summary',this)"><span class="sb-ico">📊</span> Summary</button>
    <button class="sb-item" id="nav-journal" onclick="showTab('journal',this)"><span class="sb-ico">📒</span> Journal Entry</button>
  </div>

  <div class="sb-section">
    <div class="sb-section-lbl">Data</div>
    <button class="sb-item teal-item" onclick="triggerLoadPayroll()"><span class="sb-ico">🔄</span> Load Payroll</button>
    <button class="sb-item" onclick="triggerLoadBudget()"><span class="sb-ico">📥</span> Load Budget</button>
    <input type="file" id="payroll-file-input" accept=".xlsx" style="display:none" onchange="loadPayroll(event)">
    <input type="file" id="budget-file-input" accept=".xlsx" style="display:none" onchange="loadBudget(event)">
  </div>

  <div class="sb-section">
    <div class="sb-section-lbl">Import / Export</div>
    <div class="sb-menu-wrap">
      <button class="sb-item" onclick="toggleSbMenu('sbpop-io',event)"><span class="sb-ico">⇅</span> Files ▸</button>
      <div class="sb-pop" id="sbpop-io">
        <button class="menu-item" onclick="closeMenus();exportCSV()">⬇ Employee CSV<span class="mi-sub">Chi tiết từng nhân sự + alloc</span></button>
        <button class="menu-item" onclick="closeMenus();exportSummaryCSV()">⬇ Summary CSV<span class="mi-sub">Roll-up BU / PL / matrix</span></button>
        <button class="menu-item" onclick="closeMenus();exportJSON()">⬇ JSON (Backup)<span class="mi-sub">Full state — feed Planning / Restore</span></button>
        <button class="menu-item" onclick="closeMenus();exportJournalExcel()">📒 Journal Entry Excel<span class="mi-sub">Bút toán Dr/Cr 3 sheet</span></button>
        <div class="menu-divider"></div>
        <button class="menu-item" onclick="closeMenus();exportAllocTemplate()">⬇ Export Allocation Template<span class="mi-sub">Quy tắc alloc/PL/adj theo tên+dept</span></button>
        <button class="menu-item" onclick="closeMenus();triggerApplyTemplate()">🎯 Apply Template<span class="mi-sub">Áp quy tắc vào payroll kỳ mới</span></button>
        <button class="menu-item" onclick="closeMenus();triggerImportJSON()">🔁 Restore Backup<span class="mi-sub">Khôi phục full state từ JSON</span></button>
        <input type="file" id="template-file-input" accept=".json" style="display:none" onchange="applyTemplate(event)">
        <input type="file" id="json-file-input" accept=".json" style="display:none" onchange="importJSON(event)">
      </div>
    </div>
    <button class="sb-item danger-item" onclick="clearSavedState()"><span class="sb-ico">🗑</span> Xóa trắng</button>
  </div>

  <div class="sb-spacer"></div>
  <div class="sb-footer">
    <span id="save-indicator">—</span><br>
    <span style="opacity:.6">Base = Company Expense (SHUI incl.)</span>
  </div>
</aside>

<div class="main-area">
<div class="strip" id="strip"></div>

<div class="toolbar" id="toolbar">
  <button class="btn btn-ghost" onclick="openModal()" style="white-space:nowrap">＋ Thêm người</button>
  <button class="btn btn-ghost" onclick="activateAll()" title="Bật cost tất cả nhân sự" style="white-space:nowrap">✓ Active All</button>
  <button class="btn btn-ghost" onclick="resetAlloc()" title="Xoá hết % phân bổ về 0" style="white-space:nowrap;color:var(--red);border-color:rgba(224,85,85,.3)">↺ Reset Alloc</button>
  <div style="width:1px;height:20px;background:var(--border);margin:0 4px"></div>
  <div class="search-box"><input type="text" id="search" placeholder="Tìm tên, chức danh..." oninput="filterTable()"></div>
  <select class="filter-sel" id="filter-dept" onchange="filterTable()">
    <option value="">Tất cả phòng ban</option>
    <option>MANAGEMENT</option><option>ACCOUNTING &amp; FINANCE</option><option>HR</option>
    <option>CUSTOMER SERVICE &amp; SUCCESS</option><option>MARKETING</option>
    <option>PARTNERSHIP</option><option>PRODUCT MANAGEMENT</option><option>PRODUCT OPS</option>
    <option>SALES &amp; BUSINESS DEVELOPMENT</option><option>SYSTEM &amp; ENGINEERING</option>
  </select>
  <select class="filter-sel" id="filter-status" onchange="filterTable()">
    <option value="">Tất cả status</option>
    <option value="active">Active</option><option value="inactive">Inactive</option>
  </select>
  <select class="filter-sel" id="filter-pl" onchange="filterTable()">
    <option value="">Tất cả P&amp;L line</option>
    <option>4.1 Staff cost — Salary</option>
    <option>6.1 Staff - Customer Operation</option>

// ── HELPERS ──
const fmtMc=n=>{if(!n||n===0)return'—';const v=n/1e6;return(v>=1?v.toFixed(1):v.toFixed(2))+'tr';};
const fmtMl=n=>n===0?'—':(n/1e6).toFixed(1)+'tr';
const num=s=>parseFloat(s)||0;
function effectiveCost(p){if(p.status==='inactive')return 0;return p.base+(p.adj||0);}
function allocSum(p){return BUS.reduce((s,b)=>s+num(p.alloc[b.key]),0);}
function buCost(p,buKey){return effectiveCost(p)*num(p.alloc[buKey])/100;}
function getValidBUs(pl){return PL_COA_MAP[pl]||BUS.map(b=>b.key);}
function getAutoAlloc(pl){const v=getValidBUs(pl);return v.length===1?v[0]:null;}
function applyAutoAlloc(p){const a=getAutoAlloc(p.pl_line);if(a)BUS.forEach(b=>{p.alloc[b.key]=b.key===a?100:0;});}

// ── DROPDOWN MENUS ──
function toggleMenu(id,ev){
  if(ev)ev.stopPropagation();
  const m=document.getElementById(id);const wasOpen=m.classList.contains('open');
  closeMenus();
  if(!wasOpen)m.classList.add('open');
}
function toggleSbMenu(id,ev){
  if(ev)ev.stopPropagation();
  const m=document.getElementById(id);const wasOpen=m.classList.contains('open');
  closeMenus();
  if(!wasOpen){
    m.classList.add('open');
    // position vertically aligned to the trigger button
    const btn=ev?ev.currentTarget:null;
    if(btn){const r=btn.getBoundingClientRect();m.style.top=Math.min(r.top,window.innerHeight-m.offsetHeight-20)+'px';}
  }
}
function closeMenus(){document.querySelectorAll('.menu-pop,.sb-pop').forEach(m=>m.classList.remove('open'));}
document.addEventListener('click',e=>{if(!e.target.closest('.menu-wrap')&&!e.target.closest('.sb-menu-wrap'))closeMenus();});

// ── TAB ──
function showTab(id,btn){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.sb-item').forEach(b=>{if(b.id&&b.id.startsWith('nav-'))b.classList.remove('active');});
  document.getElementById('page-'+id).classList.add('active');
  const nav=document.getElementById('nav-'+id);if(nav)nav.classList.add('active');
  document.getElementById('toolbar').style.display=id==='simulator'?'flex':'none';
  // budget period bar only in summary, only when budget loaded
  const bb=document.getElementById('summary-budget-bar');
  if(bb)bb.style.display=(id==='summary'&&typeof BUDGET!=='undefined'&&BUDGET)?'flex':'none';
  if(id==='summary')buildSummary();
  if(id==='journal')buildJournal();
}

function buildHeader(){
  const tr=document.createElement('tr');
  const fixed=[
    {l:'Nhân sự',cls:'left',style:'min-width:165px'},
    {l:'Type',cls:'center',style:'min-width:42px'},
    {l:'P&L Line',cls:'left',style:'min-width:185px'},

    {l:'Total Eff.\nCost',cls:'',style:'min-width:90px'},

    {l:'Del',cls:'center',style:'min-width:34px'},
    {l:'Alloc\nSum',cls:'center',style:'min-width:50px'},
  ];
  fixed.forEach(f=>{
    const th=document.createElement('th');
    th.className=f.cls||'';th.style.cssText=f.style||'';
    if(f.title)th.title=f.title;
    th.innerHTML=f.l.replace('\n','<br>');

  });
  BUS.forEach(b=>{
    const th=document.createElement('th');
    th.innerHTML=`${b.short}<br><span style="font-size:8px;opacity:.55">% alloc</span>`;
    th.className=`${b.thcls} th-sep`;th.style.cssText='min-width:56px';
    tr.appendChild(th);
  });
  BUS.forEach(b=>{
    const th=document.createElement('th');
    th.innerHTML=`${b.short}<br><span style="font-size:8px;opacity:.55">cost</span>`;
    th.className=`${b.outcls} th-sep`;th.style.cssText='min-width:68px';
    tr.appendChild(th);
  });
  document.getElementById('sim-thead').appendChild(tr);
}

// ── FILTER ──
function getFiltered(){
  const q=(document.getElementById('search')?.value||'').toLowerCase();
  const dept=document.getElementById('filter-dept')?.value||'';
  const status=document.getElementById('filter-status')?.value||'';
  const pl=document.getElementById('filter-pl')?.value||'';
  const et=document.getElementById('filter-emptype')?.value||'';
  return persons.filter(p=>{
    if(q&&!p.name.toLowerCase().includes(q)&&!(p.position||'').toLowerCase().includes(q))return false;
    if(dept&&p.dept!==dept)return false;
    if(status&&p.status!==status)return false;
    if(pl&&p.pl_line!==pl)return false;
    if(et&&p.emp_type!==et)return false;
    return true;
  });
}

// ── BUILD TABLE ──
function buildTable(){
  const tbody=document.getElementById('sim-tbody');tbody.innerHTML='';
  const filtered=getFiltered();
  const deptFiltered=document.getElementById('filter-dept')?.value||'';
  const depts=deptFiltered?[deptFiltered]:DEPT_ORDER;
  const numCols=10+BUS.length*2;

  if(!persons.length){
    const tr=document.createElement('tr');
    tr.innerHTML=`<td colspan="${numCols}" style="text-align:center;padding:60px 20px;color:var(--sub)">
      <div style="font-size:32px;margin-bottom:12px;opacity:.4">📋</div>
      <div style="font-size:14px;font-weight:700;color:var(--text);margin-bottom:6px">Bảng nhân sự đang trống</div>
      <div style="font-size:12px;color:var(--sub)">Nhấn <span style="color:var(--teal);font-weight:700">🔄 Load Payroll</span> để nạp dữ liệu lương từ file Excel, hoặc <span style="color:var(--text)">＋ Thêm người</span> để nhập tay.</div>
    </td>`;
    tbody.appendChild(tr);
    return;
  }

  depts.forEach(dept=>{
    const rows=filtered.filter(p=>p.dept===dept);
    if(!rows.length)return;
    const dhr=document.createElement('tr');dhr.className='dept-hdr';
    const deptLabel=DEPT_LABELS[dept]||dept;
    const dActive=rows.filter(p=>p.status==='active');
    const fte=rows.filter(p=>p.emp_type==='FTE').length;
    const prb=rows.filter(p=>p.emp_type==='PRB').length;
    const out=rows.filter(p=>p.emp_type==='OUT').length;
    dhr.innerHTML=`<td colspan="${numCols}">${deptLabel} <span style="color:var(--sub);font-size:9px;font-weight:400;font-family:var(--fm)">${rows.length} người · FTE:${fte} PRB:${prb} OUT:${out} · active: ${dActive.length} · ${fmtMl(dActive.reduce((s,p)=>s+effectiveCost(p),0))}</span></td>`;
    tbody.appendChild(dhr);

    rows.forEach(p=>{
      const tr=document.createElement('tr');
      let rowClass='person-row';
      if(p.status==='inactive')rowClass+=' inactive-row';
      if(p._new)rowClass+=' new-row';
      if(p.emp_type==='OUT')rowClass+=' out-row';
      tr.className=rowClass;tr.id=`row-${p.id}`;
      const ec=effectiveCost(p);
      const as=allocSum(p);
      const asOver=as>100.01;const asOk=Math.abs(as-100)<0.01;
      const validBUs=getValidBUs(p.pl_line);

      // Name
      const tdN=document.createElement('td');tdN.className='left';
      let tag='';
      if(p._new)tag=`<span class="name-tag new">✦ NEW T6</span>`;
      else if(p.emp_type==='OUT')tag=`<span class="name-tag out">◆ OUT</span>`;
      else if(p.emp_type==='PRB')tag=`<span class="name-tag prb">◈ PRB</span>`;
      tdN.innerHTML=`<div class="name-cell"><span class="name-main">${p.name}</span><span class="name-pos">${p.position||''}</span>${tag}</div>`;
      tr.appendChild(tdN);

      // Emp type badge
      const tdT=document.createElement('td');tdT.className='center';
      const typeColor=p.emp_type==='FTE'?'var(--green)':p.emp_type==='PRB'?'var(--amber)':'var(--purple)';
      tdT.innerHTML=`<span style="font-family:var(--fm);font-size:9px;color:${typeColor}">${p.emp_type}</span>`;
      tr.appendChild(tdT);

      // PL line
      const tdPL=document.createElement('td');tdPL.className='left';
      const sel=document.createElement('select');sel.className='pl-select';
      PL_LINES.forEach(l=>{const o=document.createElement('option');o.value=l;o.textContent=l;if(l===p.pl_line)o.selected=true;sel.appendChild(o);});
      sel.onchange=e=>{p.pl_line=e.target.value;applyAutoAlloc(p);buildTable();updateStrip();saveState();};
      tdPL.appendChild(sel);tr.appendChild(tdPL);

      // Fixed income
      const tdInc=document.createElement('td');
      tdInc.innerHTML=`<span style="font-family:var(--fm);font-size:11px;color:var(--dim)">${fmtMc(p.income||0)}</span>`;
      tr.appendChild(tdInc);

      // Base
      const tdBase=document.createElement('td');
      tdBase.innerHTML=`<span style="font-family:var(--fm);font-size:11px;color:var(--sub)">${fmtMc(p.base)}</span>`;
      tr.appendChild(tdBase);

      // Adj
      const tdAdj=document.createElement('td');
      const inp=document.createElement('input');inp.className='inp-adj';inp.type='number';inp.placeholder='0';inp.step='0.5';
      inp.value=p.adj?+(p.adj/1e6).toFixed(2):'';
      inp.oninput=e=>{p.adj=Math.round((parseFloat(e.target.value)||0)*1e6);refreshRow(p.id);updateStrip();saveState();};
      tdAdj.appendChild(inp);tr.appendChild(tdAdj);

      // Total eff cost
      const tdEC=document.createElement('td');tdEC.id=`ec-${p.id}`;
      const ecColor=p.status==='inactive'?'var(--dim)':p.adj?'var(--teal)':'#fff';
      tdEC.innerHTML=`<span style="font-family:var(--fm);font-size:11.5px;font-weight:500;color:${ecColor}" title="Base:${fmtMc(p.base)} + Adj:${fmtMc(p.adj||0)}">${fmtMc(ec)}</span>`;
      tr.appendChild(tdEC);

      // Status
      const tdS=document.createElement('td');tdS.className='center';
      const sbtn=document.createElement('button');sbtn.className=`status-toggle ${p.status}`;
      sbtn.textContent=p.status==='active'?'Active':'Inactive';
      sbtn.onclick=()=>{p.status=p.status==='active'?'inactive':'active';buildTable();updateStrip();saveState();};
      tdS.appendChild(sbtn);tr.appendChild(tdS);

      // Delete (new only)
      const tdD=document.createElement('td');tdD.className='center';
      if(p._new){
        const db=document.createElement('button');db.className='del-btn';db.textContent='✕';
        db.onclick=()=>{persons=persons.filter(x=>x.id!==p.id);buildTable();updateStrip();saveState();};
        tdD.appendChild(db);
      }
      tr.appendChild(tdD);

      // Alloc sum
      const tdAS=document.createElement('td');tdAS.className='center';tdAS.id=`as-${p.id}`;
      tdAS.innerHTML=`<span class="alloc-sum ${asOver?'over':asOk?'ok':'zero'}">${as.toFixed(0)}%</span>`;
      tr.appendChild(tdAS);

      // Alloc inputs
      BUS.forEach((b,bi)=>{
        const td=document.createElement('td');if(bi===0)td.className='th-sep';
        const isValid=validBUs.includes(b.key);
        const ai=document.createElement('input');
        ai.className=`inp-alloc ${b.cls}${asOver?' over':asOk?' full':''}${!isValid?' dim-bu':''}`;
        ai.type='number';ai.min='0';ai.max='100';ai.step='10';
        ai.value=p.alloc[b.key]||'';ai.placeholder='0';
        if(!isValid)ai.title=`${b.label} không trong COA của line này`;
        ai.oninput=e=>{p.alloc[b.key]=parseFloat(e.target.value)||0;refreshRow(p.id);updateStrip();saveState();};
        td.appendChild(ai);tr.appendChild(td);
      });

      // Cost outputs
      BUS.forEach((b,bi)=>{
        const td=document.createElement('td');td.id=`out-${p.id}-${b.key}`;
        if(bi===0)td.className='th-sep';
        const isValid=validBUs.includes(b.key);
        const cost=buCost(p,b.key);
        const dimStyle=!isValid&&cost===0?'opacity:.2':'';
        td.innerHTML=`<span class="out-val ${cost>0?b.cls+' has-val':''}" style="${dimStyle}">${cost>0?fmtMc(cost):'—'}</span>`;
        tr.appendChild(td);
      });

      tbody.appendChild(tr);
    });

    // Dept subtotal
    const stId=`st-${dept.replace(/\W/g,'_')}`;
    const stRow=document.createElement('tr');stRow.className='dept-total';stRow.id=stId;
    const totA=rows.filter(p=>p.status==='active');
    const dEC=totA.reduce((s,p)=>s+effectiveCost(p),0);
    const dAdj=totA.reduce((s,p)=>s+(p.adj||0),0);
    let stHtml=`<td>↳ ${deptLabel} SUBTOTAL (${totA.length} active / ${rows.length} total)</td>
      <td></td><td></td>
      <td style="color:var(--dim);font-family:var(--fm)">${fmtMc(totA.reduce((s,p)=>s+(p.income||0),0))}</td>
      <td style="font-family:var(--fm)"><span data-st="base">${fmtMc(totA.reduce((s,p)=>s+p.base,0))}</span></td>
      <td style="font-family:var(--fm);color:${dAdj?'var(--amber)':'var(--dim)'}"><span data-st="adj">${dAdj?fmtMc(dAdj):'—'}</span></td>
      <td><span data-st="ec">${fmtMc(dEC)}</span></td>
      <td></td><td></td><td></td>`;
    BUS.forEach(()=>stHtml+='<td></td>');
    BUS.forEach((b,bi)=>{
      const bT=totA.reduce((s,p)=>s+buCost(p,b.key),0);
      stHtml+=`<td${bi===0?' class="th-sep"':''}><span data-st="${b.key}" style="color:var(--${b.cls});font-family:var(--fm)">${bT>0?fmtMc(bT):'—'}</span></td>`;
    });
    stRow.innerHTML=stHtml;tbody.appendChild(stRow);
  });

  // Grand total
  const active=persons.filter(p=>p.status==='active');
  const gEC=active.reduce((s,p)=>s+effectiveCost(p),0);
  const gBase=active.reduce((s,p)=>s+p.base,0);
  const gAdj=active.reduce((s,p)=>s+(p.adj||0),0);
  const gtr=document.createElement('tr');gtr.className='grand-total';gtr.id='grand-total-row';
  let gHtml=`<td>GRAND TOTAL — ${active.length} ACTIVE / ${persons.length} TOTAL</td>
    <td></td><td></td>
    <td style="color:var(--dim);font-family:var(--fm)">${fmtMc(active.reduce((s,p)=>s+(p.income||0),0))}</td>
    <td style="font-family:var(--fm)"><span data-gt="base">${fmtMc(gBase)}</span></td>
    <td style="font-family:var(--fm);color:var(--amber)"><span data-gt="adj">${gAdj?fmtMc(gAdj):'—'}</span></td>
    <td style="font-family:var(--fm);font-size:13px;color:var(--gold2)"><span data-gt="ec">${fmtMc(gEC)}</span></td>
    <td></td><td></td><td></td>`;
  BUS.forEach(()=>gHtml+='<td></td>');
  BUS.forEach((b,bi)=>{
    const bT=active.reduce((s,p)=>s+buCost(p,b.key),0);
    gHtml+=`<td${bi===0?' class="th-sep"':''}><span data-gt="${b.key}" style="color:var(--${b.cls});font-weight:700;font-family:var(--fm);font-size:12px">${bT>0?fmtMc(bT):'—'}</span></td>`;
  });
  gtr.innerHTML=gHtml;tbody.appendChild(gtr);
}

// ── REFRESH ROW ──
function refreshRow(id){
  const p=persons.find(x=>x.id===id);if(!p)return;
  const ec=effectiveCost(p);const as=allocSum(p);
  const asOver=as>100.01;const asOk=Math.abs(as-100)<0.01;
  const ecEl=document.getElementById(`ec-${id}`);
  if(ecEl){
    const ecColor=p.status==='inactive'?'var(--dim)':p.adj?'var(--teal)':'#fff';
    ecEl.innerHTML=`<span style="font-family:var(--fm);font-size:11.5px;font-weight:500;color:${ecColor}" title="Base:${fmtMc(p.base)} + Adj:${fmtMc(p.adj||0)}">${fmtMc(ec)}</span>`;
  }
  const asEl=document.getElementById(`as-${id}`);
  if(asEl)asEl.innerHTML=`<span class="alloc-sum ${asOver?'over':asOk?'ok':'zero'}">${as.toFixed(0)}%</span>`;
  BUS.forEach(b=>{
    const el=document.getElementById(`out-${id}-${b.key}`);
    if(el){const cost=buCost(p,b.key);el.innerHTML=`<span class="out-val ${cost>0?b.cls+' has-val':''}">${cost>0?fmtMc(cost):'—'}</span>`;}
  });
  const stEl=document.getElementById(`st-${p.dept.replace(/\W/g,'_')}`);
  if(stEl){
    const deptP=persons.filter(x=>x.dept===p.dept&&x.status==='active');
    const dEC=deptP.reduce((s,x)=>s+effectiveCost(x),0);
    const dAdj=deptP.reduce((s,x)=>s+(x.adj||0),0);
    const dBase=deptP.reduce((s,x)=>s+x.base,0);
    stEl.querySelectorAll('[data-st]').forEach(c=>{
      const r=c.getAttribute('data-st');
      if(r==='base')c.textContent=fmtMc(dBase);
      else if(r==='adj'){c.textContent=dAdj?fmtMc(dAdj):'—';c.parentElement.style.color=dAdj?'var(--amber)':'var(--dim)';}
      else if(r==='ec')c.textContent=fmtMc(dEC);
      else{const bT=deptP.reduce((s,x)=>s+buCost(x,r),0);c.textContent=bT>0?fmtMc(bT):'—';}
    });
  }
  const gEl=document.getElementById('grand-total-row');
  if(gEl){
    const act=persons.filter(x=>x.status==='active');
    const gEC=act.reduce((s,x)=>s+effectiveCost(x),0);
    const gAdj=act.reduce((s,x)=>s+(x.adj||0),0);
    const gBase=act.reduce((s,x)=>s+x.base,0);
    gEl.querySelectorAll('[data-gt]').forEach(c=>{
      const r=c.getAttribute('data-gt');
      if(r==='base')c.textContent=fmtMc(gBase);
      else if(r==='adj')c.textContent=gAdj?fmtMc(gAdj):'—';
      else if(r==='ec')c.textContent=fmtMc(gEC);
      else{const bT=act.reduce((s,x)=>s+buCost(x,r),0);c.textContent=bT>0?fmtMc(bT):'—';}
    });
  }
}

// ── STRIP ──
function updateStrip(){
  const active=persons.filter(p=>p.status==='active');
  const gEC=active.reduce((s,p)=>s+effectiveCost(p),0);
  const gBase=active.reduce((s,p)=>s+p.base,0);
  const gAdj=active.reduce((s,p)=>s+(p.adj||0),0);
  const inactive=persons.filter(p=>p.status==='inactive').length;
  const allocated=active.filter(p=>Math.abs(allocSum(p)-100)<0.5).length;
  const buTotals=BUS.map(b=>active.reduce((s,p)=>s+buCost(p,b.key),0));
  const totalAllocated=buTotals.reduce((s,v)=>s+v,0);
  const fte=persons.filter(p=>p.emp_type==='FTE').length;
  const prb=persons.filter(p=>p.emp_type==='PRB').length;
  const out=persons.filter(p=>p.emp_type==='OUT').length;
  const strip=document.getElementById('strip');
  const kpis=[
    {lbl:'Total Cost Active',val:fmtMl(gEC),sub:`${active.length} active`,cls:''},
    {lbl:'Base T6',val:fmtMl(gBase),sub:'Company Expense',cls:''},
    {lbl:'Adj.',val:gAdj?fmtMl(gAdj):'—',sub:'Lương khác',cls:gAdj?'teal':''},
    {lbl:'FTE / PRB / OUT',val:`${fte}/${prb}/${out}`,sub:`${persons.length} total`,cls:''},
    {lbl:'Inactive',val:inactive||'—',sub:'Không tính',cls:inactive?'red':''},
    {lbl:'Alloc 100%',val:`${allocated}/${active.length}`,sub:'hoàn thiện',cls:allocated===active.length?'green':'amber'},
    {lbl:'Allocated',val:fmtMl(totalAllocated),sub:`${gEC?((totalAllocated/gEC)*100).toFixed(0):0}% tổng`,cls:'teal'},
    ...BUS.map((b,i)=>({lbl:b.short,val:fmtMl(buTotals[i]),sub:b.label,cls:''})),
  ];
  strip.innerHTML=kpis.map(k=>`<div class="kpi"><div class="kpi-lbl">${k.lbl}</div><div class="kpi-val ${k.cls}">${k.val}</div><div class="kpi-sub">${k.sub}</div></div><div style="width:1px;background:var(--border);flex-shrink:0"></div>`).join('').replace(/<div style[^>]+><\/div>$/,'');
}

// ── SUMMARY ──
function buildSummary(){
  const active=persons.filter(p=>p.status==='active');
  const wrap=document.getElementById('summary-content');
  const buTotals=BUS.map(b=>({...b,total:active.reduce((s,p)=>s+buCost(p,b.key),0),hc:active.filter(p=>p.alloc[b.key]>0).length}));
  const buGrand=buTotals.reduce((s,b)=>s+b.total,0);
  const gEC=active.reduce((s,p)=>s+effectiveCost(p),0);
  const plTotals=PL_LINES.map(l=>{
    const lp=active.filter(p=>p.pl_line===l);
    const total=lp.reduce((s,p)=>s+effectiveCost(p),0);
    const allocated=lp.reduce((s,p)=>s+BUS.reduce((ss,b)=>ss+buCost(p,b.key),0),0);
    return{l2:l,hc:lp.length,total,allocated,unalloc:total-allocated};
  });
  const crossData={};
  PL_LINES.forEach(l=>{crossData[l]={};BUS.forEach(b=>{crossData[l][b.key]=active.filter(p=>p.pl_line===l).reduce((s,p)=>s+buCost(p,b.key),0);});});
  const drillData=BUS.map(b=>{
    const plGroups=PL_LINES.map(l=>{
      const pp=active.filter(p=>p.pl_line===l&&p.alloc[b.key]>0);
      const cost=pp.reduce((s,p)=>s+buCost(p,b.key),0);
      return{l2:l,cost,persons:pp.map(p=>({name:p.name,position:p.position,dept:DEPT_LABELS[p.dept]||p.dept,ec:effectiveCost(p),pct:p.alloc[b.key]||0,cost:buCost(p,b.key)})).sort((a,b)=>b.cost-a.cost)};
    }).filter(g=>g.cost>0);
    return{...b,plGroups,buTotal:plGroups.reduce((s,g)=>s+g.cost,0)};
  }).filter(b=>b.buTotal>0);

  wrap.innerHTML=`
  ${BUDGET?(()=>{
    const per=curPeriod();
    const bGrand=budgetGrand(per);
    // BU comparison: actual = allocated cost by BU
    const buCmp=BUS.map(b=>({...b,actual:active.reduce((s,p)=>s+buCost(p,b.key),0),budget:budgetByBU(b.key,per)}));
    const actGrand=buCmp.reduce((s,b)=>s+b.actual,0);
    // PL comparison: actual = allocated cost by PL line (to match budget which is allocated)
    const plCmp=PL_LINES.map(l=>{
      const lp=active.filter(p=>p.pl_line===l);
      const actual=lp.reduce((s,p)=>s+BUS.reduce((ss,b)=>ss+buCost(p,b.key),0),0);
      return{l,actual,budget:budgetByPL(l,per)};
    });
    return `
    <div>
      <div class="sec-title" style="color:var(--teal)">⚖ Actual vs Budget (${per}) — theo BU / Segment</div>
      <div class="sum-box"><table class="sum-tbl">
        <thead><tr><th>BU / Segment</th><th>Actual (tr)</th><th>Budget (tr)</th><th>Variance</th><th>% Used</th></tr></thead>
        <tbody>
          ${buCmp.map(b=>`<tr>
            <td><span style="display:inline-block;width:8px;height:8px;background:var(--${b.cls});border-radius:2px;margin-right:6px;vertical-align:middle"></span>${b.label}</td>
            <td style="color:#fff;font-weight:600">${fmtMl(b.actual)}</td>
            <td style="color:var(--sub)">${fmtMl(b.budget)}</td>
            <td style="font-family:var(--fm)">${fmtVar(b.actual,b.budget)}</td>
            <td style="color:var(--sub)">${b.budget?(b.actual/b.budget*100).toFixed(0):'—'}%</td>
          </tr>`).join('')}
          <tr class="sum-total">
            <td>TOTAL</td><td>${fmtMl(actGrand)}</td><td>${fmtMl(bGrand)}</td>
            <td style="font-family:var(--fm)">${fmtVar(actGrand,bGrand)}</td>
            <td>${bGrand?(actGrand/bGrand*100).toFixed(0):'—'}%</td>
          </tr>
        </tbody>
      </table></div>
    </div>
    <div>
      <div class="sec-title" style="color:var(--teal)">⚖ Actual vs Budget (${per}) — theo P&L Line</div>
      <div class="sum-box"><table class="sum-tbl">
        <thead><tr><th>P&L Line</th><th>Actual alloc (tr)</th><th>Budget (tr)</th><th>Variance</th><th>% Used</th></tr></thead>
        <tbody>
          ${plCmp.map(r=>`<tr>
            <td>${r.l}</td>
            <td style="color:#fff;font-weight:600">${fmtMl(r.actual)}</td>
            <td style="color:var(--sub)">${fmtMl(r.budget)}</td>
            <td style="font-family:var(--fm)">${(r.actual>0.5||r.budget>0.5)?fmtVar(r.actual,r.budget):'—'}</td>
            <td style="color:var(--sub)">${r.budget?(r.actual/r.budget*100).toFixed(0):'—'}%</td>
          </tr>`).join('')}
          <tr class="sum-total">
            <td>TOTAL</td><td>${fmtMl(plCmp.reduce((s,r)=>s+r.actual,0))}</td><td>${fmtMl(plCmp.reduce((s,r)=>s+r.budget,0))}</td>
            <td style="font-family:var(--fm)">${fmtVar(plCmp.reduce((s,r)=>s+r.actual,0),plCmp.reduce((s,r)=>s+r.budget,0))}</td>
            <td>—</td>
          </tr>
        </tbody>
      </table></div>
    </div>
    <div>
      <div class="sec-title" style="color:var(--teal)">⚖ Variance Matrix (${per}) — P&L × BU · Actual − Budget (tr)</div>
      <div class="sum-box"><table class="sum-tbl">
        <thead><tr><th>P&L Line</th>${BUS.map(b=>`<th style="color:var(--${b.cls})">${b.short}</th>`).join('')}<th>Row Var</th></tr></thead>
        <tbody>
          ${PL_LINES.map(l=>{
            const lp=active.filter(p=>p.pl_line===l);
            let rowVar=0;
            const cells=BUS.map(b=>{
              const act=lp.reduce((s,p)=>s+buCost(p,b.key),0);
              const bud=getBudget(b.key,l,per);
              const v=act-bud;rowVar+=v;

// Block 1: chi phí công ty (= base). Cost components, mỗi cái 1 cặp Dr/Cr, chi tiết PL×BU.
// Adj (ngoài payroll) → gộp vào Cost 1.
const JE_COST=[
  {key:'cost1',label:'Cost 1 — Lương + phụ cấp',cr:'Payable to Employee',cr_acc:'334',withAdj:true},
  {key:'cost2',label:'Cost 2 — BHXH công ty (17.5%)',cr:'Payable to Social Insurance',cr_acc:'3383'},

  {key:'cost4',label:'Cost 4 — BHTN công ty (1%)',cr:'Payable to Social Insurance',cr_acc:'3386'},
  {key:'cost5',label:'Cost 5 — Trade Union công ty (2%)',cr:'Payable to Trade Union',cr_acc:'3382'},
];
// Block 2: khấu trừ từ NV. Dr Payable Employee / Cr payable khác. Theo PL line, KHÔNG BU.
const JE_DED=[
  {key:'ded1',label:'Deduction 1 — BHXH NV (8%)',cr:'Payable to Social Insurance',cr_acc:'3383'},
  {key:'ded2',label:'Deduction 2 — BHYT NV (1.5%)',cr:'Payable to Social Insurance',cr_acc:'3384'},
  {key:'ded3',label:'Deduction 3 — BHTN NV (1%)',cr:'Payable to Social Insurance',cr_acc:'3386'},
  {key:'ded4',label:'Deduction 4 — Union NV (0.5%)',cr:'Payable to Trade Union',cr_acc:'3382'},
  {key:'ded5',label:'Deduction 5 — Thuế TNCN (PIT)',cr:'Payable to Tax',cr_acc:'3335'},
];
// PL line → debit account (632/642 staff cost). Dùng acc 642111 cho tất cả (CP lương NV QL).
const PL_DR_ACC='642111';

function comp(p,key){
  // cost1 includes adj (book 100% adj to Cost 1)
  if(p.status==='inactive')return 0;
  // New/imported hires without payroll breakdown: book full base to cost1
  if(!p.comp){
    if(key==='cost1')return p.base+(p.adj||0);
    return 0;
  }
  const base=p.comp[key]||0;
  if(key==='cost1')return base+(p.adj||0);
  return base;
}
function compBU(p,key,buKey){return comp(p,key)*num(p.alloc[buKey])/100;}

// ── LOCAL STORAGE ──
const LS_KEY='finan_sim_t6_v29';
function saveState(){
  try{
    // Persist FULL editable state incl. base/comp/income (Load Payroll can change these for any person)
    const snap=persons.map(p=>({
      id:p.id,emp_no:p.emp_no,name:p.name,position:p.position,dept:p.dept,dept_label:p.dept_label,
      emp_type:p.emp_type,status:p.status,income:p.income,base:p.base,adj:p.adj,
      pl_line:p.pl_line,alloc:{...p.alloc},comp:p.comp?{...p.comp}:null,_new:p._new||false
    }));
    localStorage.setItem(LS_KEY,JSON.stringify({ts:Date.now(),persons:snap}));
    const ind=document.getElementById('save-indicator');
    if(ind){ind.textContent='✓ Saved';ind.style.color='var(--green)';setTimeout(()=>{ind.textContent='Auto-saved';ind.style.color='var(--dim)';},1500);}
  }catch(e){console.warn('Save failed',e);}
}
function loadState(){
  try{
    const raw=localStorage.getItem(LS_KEY);if(!raw)return false;
    const saved=JSON.parse(raw);if(!saved?.persons?.length)return false;
    saved.persons.forEach(s=>{
      const p=persons.find(x=>x.id===s.id)||(s.name?persons.find(x=>x.name===s.name&&x.emp_type===s.emp_type&&!x._restored):null);
      if(p){
        // restore full editable state
        p.status=s.status;p.adj=s.adj||0;p.pl_line=s.pl_line;p.alloc={...s.alloc};
        if(s.base!=null)p.base=s.base;
        if(s.income!=null)p.income=s.income;
        if(s.comp)p.comp={...s.comp};
        if(s.emp_type)p.emp_type=s.emp_type;
        if(s.position)p.position=s.position;
        if(s.dept){p.dept=s.dept;p.dept_label=s.dept_label||DEPT_LABELS[s.dept]||s.dept;}
        p._restored=true;
      }else if(s._new||s.name){
        // person added/loaded that isn't in PERSONS_RAW
        persons.push({id:s.id,emp_no:s.emp_no||'NEW',name:s.name,position:s.position||'',dept:s.dept,dept_label:s.dept_label||DEPT_LABELS[s.dept]||s.dept,income:s.income||0,base:s.base||0,adj:s.adj||0,status:s.status||'active',emp_type:s.emp_type||'FTE',pl_line:s.pl_line,alloc:{...s.alloc},comp:s.comp?{...s.comp}:null,_new:s._new||false,_restored:true});
      }
    });
    persons.forEach(p=>{delete p._restored;});
    return true;
  }catch(e){return false;}
}

// ── RESTORE BACKUP (full state incl. comp, from JSON export) ──
function triggerImportJSON(){
  if(!confirm('🔁 RESTORE BACKUP\n\nKhôi phục TOÀN BỘ trạng thái (base, components, alloc%, adj, P&L line, status) từ file JSON đã export trước.\nDùng để chuyển máy hoặc khôi phục phiên làm việc.\n\nState hiện tại sẽ bị ghi đè. Tiếp tục?'))return;
  document.getElementById('json-file-input').click();
}
function importJSON(event){
  const file=event.target.files[0];if(!file)return;
  const reader=new FileReader();
  reader.onload=function(e){
    try{
      const data=JSON.parse(e.target.result);
      const list=data.persons||data.employees||(Array.isArray(data)?data:null);
      if(!list||!list.length){alert('File JSON không có mảng persons hợp lệ.');return;}
      const normType=s=>s==='OUT'?'OUT':s==='PRB'?'PRB':'FTE';
      let updated=0,added=0,skipped=0;const usedOld=new Set();
      list.forEach(s=>{
        const id=s.id;
        const name=(s.name||'').trim();
        const adj=Math.round(s.adjustment!==undefined?s.adjustment:(s.adj||0));
        const status=s.status||'active';
        const pl_line=s.pl_line||'';
        const etype=normType(s.emp_type);
        const alloc={};
        BUS.forEach(b=>{
          const a=s.allocations?s.allocations[b.key]:(s.alloc?s.alloc[b.key]:undefined);
          alloc[b.key]=(a&&typeof a==='object')?(a.pct||0):(a||0);
        });
        const base=Math.round(s.base_cost!==undefined?s.base_cost:(s.base||0));
        const income=Math.round(s.fixed_income!==undefined?s.fixed_income:(s.income||0));
        // comp from export (allocations don't carry comp; backup JSON should). Accept s.comp or rebuild cost1=base
        let comp=s.comp?{...s.comp}:null;
        // match: id (unused) → name+emp_type → name+dept → name
        let p=id!==undefined?persons.find(x=>x.id===id&&!usedOld.has(x)):null;
        if(!p&&name)p=persons.find(x=>x.name===name&&normType(x.emp_type)===etype&&!usedOld.has(x));
        if(!p&&name)p=persons.find(x=>x.name===name&&x.dept===s.dept&&!usedOld.has(x));
        if(!p&&name)p=persons.find(x=>x.name===name&&!usedOld.has(x));
        if(p){
          usedOld.add(p);
          p.adj=adj;p.status=status||p.status;if(pl_line)p.pl_line=pl_line;p.alloc={...alloc};
          if(base>0)p.base=base;if(income>0)p.income=income;
          if(comp)p.comp=comp;p.emp_type=etype;
          updated++;
        }else if(name&&base>0){
          if(!comp)comp={cost1:base,cost2:0,cost3:0,cost4:0,cost5:0,ded1:0,ded2:0,ded3:0,ded4:0,ded5:0};
          persons.push({
            id:id||Date.now()+added,emp_no:s.emp_no||'IMP',name,
            position:s.position||'',dept:s.dept||'',dept_label:DEPT_LABELS[s.dept]||s.dept||'',
            income,base,adj,status:status||'active',emp_type:etype,
            pl_line:pl_line||DEPT_PL[s.dept]||'7.99 Khác',alloc,comp,_new:true,
          });
          added++;
        }else skipped++;
      });
      buildTable();updateStrip();saveState();
      event.target.value='';
      alert(`🔁 Restore Backup hoàn tất:\n✓ Khôi phục: ${updated}\n✦ Thêm mới: ${added}\n— Bỏ qua: ${skipped}`);
    }catch(err){console.error(err);alert('Lỗi đọc JSON: '+err.message);}
  };
  reader.readAsText(file,'UTF-8');
}

function applyTemplate(event){
  const file=event.target.files[0];if(!file)return;
  const reader=new FileReader();
  reader.onload=function(e){
    try{
      const data=JSON.parse(e.target.result);
      const rules=data.rules||(Array.isArray(data)?data:null);
      if(!rules||!rules.length){alert('File template không hợp lệ (thiếu mảng rules).');return;}
      const normType=s=>s==='OUT'?'OUT':s==='PRB'?'PRB':'FTE';
      const usedRule=new Set();
      let applied=0;const noRule=[];
      // For each current person, find matching rule by name+dept (+emp_type for dups)
      persons.forEach(p=>{
        const et=normType(p.emp_type);
        let r=rules.find(x=>!usedRule.has(x)&&x.name===p.name&&x.dept===p.dept&&normType(x.emp_type)===et);
        if(!r)r=rules.find(x=>!usedRule.has(x)&&x.name===p.name&&x.dept===p.dept);
        if(!r)r=rules.find(x=>!usedRule.has(x)&&x.name===p.name);
        if(r){
          usedRule.add(r);
          if(r.alloc)p.alloc={...p.alloc,...r.alloc};
          if(r.pl_line)p.pl_line=r.pl_line;
          if(r.status)p.status=r.status;
          if(r.adj!==undefined)p.adj=Math.round(r.adj);
          applied++;
        }else{
          noRule.push(`${p.name}${et!=='FTE'?' ('+et+')':''} · ${p.dept_label||p.dept}`);
        }
      });
      buildTable();updateStrip();saveState();
      event.target.value='';
      let msg=`🎯 Apply Template hoàn tất:\n✓ Áp quy tắc: ${applied}\n`;
      if(noRule.length){
        msg+=`⚠ Chưa có rule (cần set tay): ${noRule.length}\n`;
        msg+=noRule.slice(0,12).map(n=>'  • '+n).join('\n');
        if(noRule.length>12)msg+=`\n  ...và ${noRule.length-12} người nữa`;
        msg+=`\n\n→ Set alloc cho họ rồi Export Template lại để lần sau tự áp.`;
      }else{
        msg+=`✓ Tất cả nhân sự đều có rule.`;
      }
      alert(msg);
    }catch(err){console.error(err);alert('Lỗi đọc template: '+err.message);}
  };
  reader.readAsText(file,'UTF-8');
}

// ── LOAD BUDGET (from Financial Forecast xlsx) ──
let BUDGET=null; // {buKey: {pl_line: {T5,T6,...}}}
const SCOPE_TO_BU={
  'BU12 — SBH Own channel':'SBH_own',
  'BU12 — SBH Partnership':'SBH_partner',
  'BU12 — HLB':'HLB',
  'BU3 — FinanOne':'BU3',
  'Corporate Shared Service':'CSS',
};
function triggerLoadBudget(){
  if(typeof XLSX==='undefined'){alert('Thư viện Excel chưa load. Kiểm tra mạng rồi thử lại.');return;}
  document.getElementById('budget-file-input').click();
}
function loadBudget(event){
  const file=event.target.files[0];if(!file)return;
  const reader=new FileReader();
  reader.onload=function(e){
    try{
      const wb=XLSX.read(new Uint8Array(e.target.result),{type:'array'});
      const sheet=wb.Sheets['05_Staff_Cost'];
      if(!sheet){alert('Không tìm thấy sheet "05_Staff_Cost" trong file.');return;}
      const rows=XLSX.utils.sheet_to_json(sheet,{header:1});
      if(!rows.length){alert('Sheet 05_Staff_Cost rỗng.');return;}
      const hdr=rows[0].map(h=>String(h).trim());
      const ci={};['Scope','P&L Line','T5','T6','T7','T8','T9','Forecast Total T5-T9'].forEach(c=>ci[c]=hdr.indexOf(c));
      if(ci['Scope']<0||ci['P&L Line']<0){alert('Sheet thiếu cột Scope hoặc P&L Line.');return;}
      const periods=['T5','T6','T7','T8','T9','Forecast Total T5-T9'];
      const budget={};let parsed=0;const unmapped=new Set();
      rows.slice(1).forEach(r=>{
        const scope=String(r[ci['Scope']]||'').trim();
        const pl=String(r[ci['P&L Line']]||'').trim();
        if(!scope||!pl)return;
        const buKey=SCOPE_TO_BU[scope];
        if(!buKey){unmapped.add(scope);return;}
        if(!budget[buKey])budget[buKey]={};
        if(!budget[buKey][pl])budget[buKey][pl]={};
        periods.forEach(per=>{
          if(ci[per]>=0){const v=parseFloat(r[ci[per]])||0;budget[buKey][pl][per]=Math.abs(v)*1e6;}
        });
        parsed++;
      });
      BUDGET=budget;
      event.target.value='';
      let msg=`Load budget hoàn tất: ${parsed} dòng (Scope × P&L).`;
      if(unmapped.size)msg+=`\n⚠ Scope chưa map: ${[...unmapped].join(', ')}`;
      msg+='\nChuyển sang tab Summary để xem so sánh.';
      alert(msg);
      // jump to Summary via sidebar nav (shows budget bar inside showTab)
      const nav=document.getElementById('nav-summary');if(nav)showTab('summary',nav);
    }catch(err){console.error(err);alert('Lỗi đọc file budget: '+err.message);}
  };
  reader.readAsArrayBuffer(file);
}
function getBudget(buKey,pl,per){if(!BUDGET||!BUDGET[buKey]||!BUDGET[buKey][pl])return 0;return BUDGET[buKey][pl][per]||0;}
function budgetByBU(buKey,per){if(!BUDGET||!BUDGET[buKey])return 0;return Object.values(BUDGET[buKey]).reduce((s,o)=>s+(o[per]||0),0);}
function budgetByPL(pl,per){if(!BUDGET)return 0;return Object.keys(BUDGET).reduce((s,bk)=>s+(BUDGET[bk][pl]?BUDGET[bk][pl][per]||0:0),0);}
function budgetGrand(per){if(!BUDGET)return 0;return Object.keys(BUDGET).reduce((s,bk)=>s+budgetByBU(bk,per),0);}
function curPeriod(){const el=document.getElementById('budget-period');return el?el.value:'T6';}
function fmtVar(actual,budget){
  const v=actual-budget;const pct=budget!==0?(v/budget*100):0;
  const color=Math.abs(v)<budget*0.02?'var(--green)':(v>0?'var(--red)':'var(--teal)');
  const sign=v>0?'+':'';
  return `<span style="color:${color}">${sign}${fmtMl(Math.abs(v))}${v<0?' ↓':v>0?' ↑':''} (${sign}${pct.toFixed(0)}%)</span>`;
}

// ── LOAD PAYROLL (from Payroll_to_BOD xlsx, merge keep state) ──
function triggerLoadPayroll(){
  if(typeof XLSX==='undefined'){alert('Thư viện Excel chưa load. Kiểm tra mạng rồi thử lại.');return;}
  if(!confirm('Load Payroll sẽ MERGE data lương mới:\n• Người đã có: cập nhật base + components, GIỮ alloc%/adj/PL line\n• Người mới: thêm vào\n• Người cũ không có trong file: giữ lại, đánh dấu\n\nSẽ hiện preview trước khi áp dụng. Tiếp tục?'))return;
  document.getElementById('payroll-file-input').click();
}
function _norm(s){return String(s==null?'':s).trim();}
function _numCell(v){if(v==null||v==='-'||v==='')return 0;const n=parseFloat(String(v).replace(/,/g,''));return isNaN(n)?0:n;}
function loadPayroll(event){
  const file=event.target.files[0];if(!file)return;
  const reader=new FileReader();
  reader.onload=function(e){
    try{
      const wb=XLSX.read(new Uint8Array(e.target.result),{type:'array'});
      const sheet=wb.Sheets['Payroll T05']||wb.Sheets[wb.SheetNames[0]];
      if(!sheet){alert('Không tìm thấy sheet Payroll.');return;}
      const rows=XLSX.utils.sheet_to_json(sheet,{header:1,defval:null});
      // Find EN header row: the row containing 'FULL NAME' and 'COMPANY EXPENSE'
      let hr=-1;
      for(let i=0;i<Math.min(10,rows.length);i++){
        const joined=(rows[i]||[]).map(x=>_norm(x).toUpperCase()).join('|');
        if(joined.includes('FULL NAME')&&joined.includes('DEPARTMENT')){hr=i;break;}
      }
      if(hr<0){alert('Không tìm thấy dòng header (FULL NAME / DEPARTMENT).');return;}
      const H=rows[hr].map(x=>_norm(x));
      const find=(...kw)=>{for(let i=0;i<H.length;i++){if(H[i]&&kw.every(k=>H[i].toUpperCase().includes(k.toUpperCase())))return i;}return -1;};
      // identity
      const cName=find('FULL NAME'),cPos=find('POSITION'),cDept=find('DEPARTMENT'),cStatus=find('STATUS');
      const cFixed=find('TOTAL FIXED INCOME'),cActual=find('ACTUAL SALARY'),cCE=find('COMPANY EXPENSE');
      if(cName<0||cDept<0||cCE<0||cActual<0){alert('Thiếu cột bắt buộc (NAME/DEPT/ACTUAL SALARY/COMPANY EXPENSE).');return;}
      // component anchors + offset
      const shuiCo=find('SHUI BY COMPANY'),shuiEe=find('SHUI BY EMPLOYEE'),tu=find('TOTAL TRADE UNION'),pit=find('INCOME TAX PAYAB');
      const c2=shuiCo-3,c3=shuiCo-2,c4=shuiCo-1;
      const dd1=shuiEe-3,dd2=shuiEe-2,dd3=shuiEe-1;
      const c5=tu-2,dd4=tu-1;
      const cPIT=pit;
      // section keywords to skip
      const isSection=a=>{const u=_norm(a).toUpperCase();return['CAPITAL','FTE','PRB','OUT','TỔNG','CỘNG','FINAN ='].some(k=>u.includes(k))||['A.','B.','C.','I.','II.','III.','IV.'].includes(u);};
      // parse employees: col0 (STT) numeric + has name
      const parsed=[];
      for(let r=hr+2;r<rows.length;r++){
        const row=rows[r];if(!row)continue;
        const stt=row[0],name=_norm(row[cName]);
        if(!name)continue;
        const sttNum=parseInt(String(stt).trim());
        if(isNaN(sttNum))continue;       // employee rows have numeric STT
        if(isSection(stt))continue;
        const dept=_norm(row[cDept]);
        if(!dept)continue;
        const base=Math.round(_numCell(row[cCE]));
        parsed.push({
          name,position:_norm(row[cPos]),dept,
          status:_norm(row[cStatus])||'FTE',
          income:Math.round(_numCell(row[cFixed])),
          base,
          comp:{
            cost1:Math.round(_numCell(row[cActual])),
            cost2:Math.round(_numCell(row[c2])),cost3:Math.round(_numCell(row[c3])),cost4:Math.round(_numCell(row[c4])),
            cost5:Math.round(_numCell(row[c5])),
            ded1:Math.round(_numCell(row[dd1])),ded2:Math.round(_numCell(row[dd2])),ded3:Math.round(_numCell(row[dd3])),
            ded4:Math.round(_numCell(row[dd4])),ded5:Math.round(_numCell(row[cPIT])),
          }
        });
      }
      if(!parsed.length){alert('Không parse được nhân viên nào. Kiểm tra format file.');return;}

      // MERGE: match by name + emp_type (status) so duplicate-name records (PRB/OUT/FTE) map correctly
      const normType=s=>s==='OUT'?'OUT':s==='PRB'?'PRB':'FTE';
      parsed.forEach(p=>{p._etype=normType(p.status);});
      let updated=0,added=0,missing=0;const usedNew=new Set();const matchedOld=new Set();const missingList=[];
      const applyUpdate=(p,np)=>{
        usedNew.add(np);matchedOld.add(p);
        p.position=np.position||p.position;
        p.dept=np.dept;p.dept_label=DEPT_LABELS[np.dept]||np.dept;
        p.income=np.income;p.base=np.base;p.comp=np.comp;p.emp_type=np._etype;
        // KEEP: status(active/inactive), adj, pl_line, alloc
        updated++;
      };
      // PASS 1 — exact name + emp_type (handles PRB/OUT/FTE splits precisely)
      persons.forEach(p=>{
        const ot=normType(p.emp_type);
        const idx=parsed.findIndex(c=>!usedNew.has(c)&&c.name===p.name&&c._etype===ot);
        if(idx>=0)applyUpdate(p,parsed[idx]);
      });
      // PASS 2 — fallback name + dept (type may have changed), then name only
      persons.forEach(p=>{
        if(matchedOld.has(p))return;
        let idx=parsed.findIndex(c=>!usedNew.has(c)&&c.name===p.name&&c.dept===p.dept);
        if(idx<0)idx=parsed.findIndex(c=>!usedNew.has(c)&&c.name===p.name);
        if(idx>=0)applyUpdate(p,parsed[idx]);
        else{missing++;missingList.push(p.name+(normType(p.emp_type)!=='FTE'?` (${normType(p.emp_type)})`:''));}
      });
      // add new (records in file with no old match — incl. genuinely new PRB/OUT splits)
      let newId=Math.max(0,...persons.map(p=>p.id))+1;
      parsed.forEach(np=>{
        if(usedNew.has(np))return;
        persons.push({
          id:newId++,emp_no:'NEW',name:np.name,position:np.position,
          dept:np.dept,dept_label:DEPT_LABELS[np.dept]||np.dept,
          income:np.income,base:np.base,adj:0,
          status:'active',emp_type:np._etype,
          pl_line:DEPT_PL[np.dept]||'7.99 Khác',
          alloc:(()=>{const a={SBH_own:0,SBH_partner:0,HLB:0,BU3:0,CSS:0};const auto=getAutoAlloc(DEPT_PL[np.dept]);if(auto)a[auto]=100;else if(np.dept==='SALES & BUSINESS DEVELOPMENT')a.SBH_own=100;return a;})(),
          comp:np.comp,_new:true,
        });
        added++;
      });
      buildTable();updateStrip();saveState();
      event.target.value='';
      const totalCE=parsed.reduce((s,p)=>s+p.base,0);
      let msg=`✓ LOAD PAYROLL HOÀN TẤT (merge)\n\n`;
      msg+=`File: ${parsed.length} nhân viên · Company Expense ${(totalCE/1e6).toFixed(1)}tr\n\n`;
      msg+=`• Cập nhật (giữ alloc/adj/PL): ${updated}\n`;
      msg+=`• Thêm mới: ${added}\n`;
      msg+=`• Cũ không có trong file: ${missing}`;
      if(missingList.length)msg+=`\n  → ${missingList.slice(0,8).join(', ')}${missingList.length>8?'...':''}`;
      alert(msg);
    }catch(err){console.error(err);alert('Lỗi đọc payroll: '+err.message);}
  };
  reader.readAsArrayBuffer(file);
}
